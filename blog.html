<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Feature Test — AliverBiopharm</title><style>body{font-family:'DM Sans',sans-serif;background:#eef7f7;color:#0d2e2e;padding:20px;max-width:600px;margin:0 auto}body.dark{background:#012c2c;color:#f9f5ee}.card{background:rgba(255,255,255,0.82);border:1px solid rgba(10,181,181,0.22);border-radius:14px;padding:20px;margin:10px 0}.dark .card{background:rgba(2,82,82,0.45);border-color:rgba(10,181,181,0.25)}.green{color:#10b981}.red{color:#ef4444}.cyan{color:#0ab5b5}pre{background:rgba(0,0,0,0.08);padding:10px;border-radius:8px;overflow-x:auto;font-size:12px}.dark pre{background:rgba(0,0,0,0.3)}button{padding:14px 34px;background:linear-gradient(135deg,#b8873a,#e2c06a);color:#fff;border:none;border-radius:50px;cursor:pointer;font-weight:700;font-size:14px;box-shadow:0 8px 28px rgba(184,135,58,0.38)}button:hover{transform:scale(1.04)}.status{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}.badge-green{background:rgba(16,185,129,0.15);color:#10b981}.badge-red{background:rgba(239,68,68,0.15);color:#ef4444}</style></head><body><h1>🔧 Feature Test</h1><p>Tests <code>/api/query?action=get_app_features&page_id=quiz</code></p><button onclick="testGET()">Test GET Request</button><button onclick="testPOST()" style="margin-left:10px">Test POST Request</button><div id="results"><p>Click a button to test...</p></div><script>
var API_BASE='/api/query';
function esc(t){if(!t)return'';return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
async function testGET(){
  var el=document.getElementById('results');
  el.innerHTML='<p class="cyan">⏳ GET: Fetching features...</p>';
  try{
    var token=localStorage.getItem('sb-token');
    var headers={};if(token)headers['Authorization']='Bearer '+token;
    var url=API_BASE+'?action=get_app_features&page_id=quiz';
    var r=await fetch(url,{method:'GET',headers:headers});
    var j=await r.json();
    showResults(r.status,j,el,'GET')
  }catch(e){
    el.innerHTML='<p class="red">❌ GET Error: '+esc(e.message)+'</p>'
  }
}
async function testPOST(){
  var el=document.getElementById('results');
  el.innerHTML='<p class="cyan">⏳ POST: Fetching features...</p>';
  try{
    var token=localStorage.getItem('sb-token');
    var headers={'Content-Type':'application/json'};if(token)headers['Authorization']='Bearer '+token;
    var r=await fetch(API_BASE,{method:'POST',headers:headers,body:JSON.stringify({action:'get_app_features',page_id:'quiz'})});
    var j=await r.json();
    showResults(r.status,j.data||j,el,'POST')
  }catch(e){
    el.innerHTML='<p class="red">❌ POST Error: '+esc(e.message)+'</p>'
  }
}
function showResults(status,data,el,method){
  var arr=Array.isArray(data)?data:(data&&Array.isArray(data.data)?data.data:[]);
  var html='<div class="card"><strong>Method:</strong> '+method+'<br><strong>Status:</strong> <span class="'+(status===200?'green':'red')+'">'+status+'</span><br><strong>Count:</strong> '+arr.length+' features</div>';
  if(arr.length>0){
    html+='<h3>✅ Features:</h3>';
    for(var i=0;i<arr.length;i++){
      var f=arr[i];
      html+='<div class="card"><strong>'+(i+1)+'.</strong> '+esc(f.feature_key||'unknown')+'<br><span class="status '+(f.is_enabled?'badge-green':'badge-red')+'">is_enabled: '+f.is_enabled+'</span> <span class="status '+(f.user_enabled?'badge-green':'badge-red')+'">user_enabled: '+f.user_enabled+'</span></div>'
    }
  }else{
    html+='<p class="red">❌ Empty array — no features in database.</p>'
  }
  html+='<details style="margin-top:10px"><summary>Raw JSON</summary><pre>'+esc(JSON.stringify(data,null,2))+'</pre></details>';
  el.innerHTML=html
}
</script><script>
  window.va = window.va || function () { 
    (window.vaq = window.vaq || []).push(arguments); 
  };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body></html>
