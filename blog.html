  <style>
    :root {
      --clr-deep-space: #0b0b1a;
      --clr-cyan: #00d9ff;
      --clr-magenta: #ff00aa;
      --clr-navy-card: #1a1a2e;
      --clr-navy-light: #16213e;
      --clr-white: #e0f0ff;
      --clr-text-dim: #9aa9c1;
      --clr-text-muted: #6b7a94;
      --clr-border-glow: rgba(0, 217, 255, 0.25);
      --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.3);
      --transition-fast: 180ms ease;
      --transition-smooth: 350ms cubic-bezier(0.4, 0, 0.2, 1);
      --max-width: 1200px;
      --font-body: 'Inter', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --radius-sm: 0.5rem;
      --radius-md: 0.75rem;
      --radius-lg: 1.25rem;
      --gradient-cyan: linear-gradient(135deg, #00d9ff, #00b4d8);
      --gradient-magenta: linear-gradient(135deg, #ff00aa, #d6008e);
    }

    body.light-mode {
      --clr-deep-space: #f0f4f8;
      --clr-cyan: #0077b6;
      --clr-magenta: #d6008e;
      --clr-navy-card: #ffffff;
      --clr-navy-light: #e8edf2;
      --clr-white: #0b1a2f;
      --clr-text-dim: #2c3e50;
      --clr-text-muted: #4a5568;
      --clr-border-glow: rgba(0, 119, 182, 0.25);
      --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.08);
    }

    *,
    *::before,
    *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; font-size: 16px; -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--clr-deep-space);
      color: var(--clr-white);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    img { max-width: 100%; height: auto; }

    .skip-link {
      position: absolute;
      top: -100%;
      left: 1rem;
      z-index: 1000;
      background: var(--clr-cyan);
      color: #0b0b1a;
      padding: 0.65rem 1.3rem;
      border-radius: 30px;
      font-weight: 700;
      text-decoration: none;
      transition: top var(--transition-fast);
      font-size: 0.9rem;
    }
    .skip-link:focus { top: 0.75rem; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 11, 26, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--clr-border-glow);
      padding: 0.8rem 0;
      transition: background 0.3s;
    }
    body.light-mode .site-header { background: rgba(240, 244, 248, 0.92); }

    .header-container {
      max-width: var(--max-width);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
    }

    .logo-link {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--clr-cyan);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: opacity var(--transition-fast);
    }
    .logo-link:hover { opacity: 0.85; }
    .logo-link i { color: var(--clr-magenta); }

    .nav-actions { display: flex; gap: 0.8rem; align-items: center; }

    .theme-toggle,
    .home-btn {
      background: transparent;
      border: 1px solid var(--clr-cyan);
      color: var(--clr-cyan);
      font-size: 0.9rem;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all var(--transition-fast);
      font-family: var(--font-body);
    }
    .home-btn:hover,
    .theme-toggle:hover {
      background: var(--clr-cyan);
      color: #0b0b1a;
    }

    .section { max-width: var(--max-width); margin: 3rem auto; padding: 0 1.5rem; }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 700;
      color: var(--clr-cyan);
      margin-bottom: 0.5rem;
      text-align: center;
      letter-spacing: -0.02em;
    }
    .section-subtitle { text-align: center; color: var(--clr-text-dim); margin-bottom: 2rem; font-size: 1rem; max-width: 600px; margin-left: auto; margin-right: auto; }

    .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }

    .post-card {
      background: var(--clr-navy-card);
      border: 1px solid var(--clr-border-glow);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
    }
    .post-card:hover { transform: translateY(-4px); border-color: var(--clr-magenta); }

    .post-image {
      height: 180px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .post-body { padding: 1.5rem; display: flex; flex-direction: column; flex: 1; }

    .post-body h2 {
      color: var(--clr-white);
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
      font-family: var(--font-display);
      font-weight: 600;
      line-height: 1.4;
    }
    .post-body p { color: var(--clr-text-dim); font-size: 0.9rem; line-height: 1.6; margin-bottom: 1rem; flex: 1; }

    .post-meta { display: flex; gap: 1rem; font-size: 0.8rem; color: var(--clr-text-muted); margin-bottom: 0.8rem; flex-wrap: wrap; }

    .read-more {
      color: var(--clr-magenta);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: color var(--transition-fast);
      align-self: flex-start;
    }
    .read-more:hover { color: var(--clr-cyan); text-decoration: underline; }

    .newsletter-card {
      background: var(--gradient-magenta);
      color: #fff;
      border-radius: var(--radius-lg);
      padding: 2rem;
      text-align: center;
      margin-top: 3rem;
      box-shadow: 0 12px 40px rgba(255, 0, 170, 0.25);
    }
    .newsletter-card h2 {
      font-family: var(--font-display);
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }
    .newsletter-card p { margin-bottom: 1rem; opacity: 0.9; }

    .newsletter-form { display: flex; gap: 0.5rem; max-width: 450px; margin: 1rem auto 0; }
    .newsletter-form input {
      flex: 1;
      padding: 0.7rem 1rem;
      border: none;
      border-radius: 30px;
      font-family: var(--font-body);
      font-size: 0.9rem;
    }
    .newsletter-form button {
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 30px;
      background: #0b0b1a;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-body);
      font-size: 0.9rem;
      transition: all var(--transition-fast);
    }
    .newsletter-form button:hover { background: #1a1a2e; transform: scale(1.03); }

    .footer-fat {
      background: #060615;
      border-top: 2px solid var(--clr-cyan);
      padding: 3rem 1.5rem 1.5rem;
      margin-top: auto;
    }
    body.light-mode .footer-fat { background: #e0e8f0; }

    .footer-grid {
      max-width: var(--max-width);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 2rem;
    }
    .footer-col h3 {
      font-family: var(--font-display);
      color: var(--clr-cyan);
      font-weight: 600;
      margin-bottom: 1rem;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .footer-col a {
      color: var(--clr-text-dim);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color var(--transition-fast);
    }
    .footer-col a:hover { color: var(--clr-magenta); }

    .footer-social { display: flex; gap: 1rem; margin-top: 1rem; }
    .footer-social a {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--clr-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--clr-cyan);
      text-decoration: none;
      transition: all var(--transition-fast);
    }
    .footer-social a:hover { background: var(--clr-magenta); border-color: var(--clr-magenta); color: #fff; }

    .footer-bottom {
      max-width: var(--max-width);
      margin: 2rem auto 0;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--clr-text-muted);
    }
    .footer-bottom nav { display: flex; gap: 1.5rem; }
    .footer-bottom nav a { color: var(--clr-text-dim); text-decoration: none; font-size: 0.8rem; }
    .footer-bottom nav a:hover { color: var(--clr-magenta); }

    .spinner { text-align: center; padding: 3rem; color: var(--clr-cyan); }
    .spinner i { font-size: 2.5rem; animation: spin 1.2s linear infinite; }

    .no-content { text-align: center; padding: 3rem 1rem; color: var(--clr-text-dim); }
    .no-content i { font-size: 3rem; color: var(--clr-cyan); margin-bottom: 1rem; display: block; }

    .error-state { text-align: center; padding: 3rem 1rem; color: var(--clr-magenta); }
    .error-state i { font-size: 3rem; margin-bottom: 1rem; display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .posts-grid { grid-template-columns: 1fr; }
      .newsletter-form { flex-direction: column; }
      .newsletter-form button { width: 100%; }
      .footer-bottom { flex-direction: column; text-align: center; }
      .footer-bottom nav { justify-content: center; }
      .section { margin: 2rem auto; }
    }

    @media (max-width: 480px) {
      .header-container { padding: 0 1rem; }
      .logo-link { font-size: 1.2rem; }
      .section { padding: 0 1rem; }
    }
  </style>

<body>

  <script>
    const API_BASE = '/api/query';
    
    async function apiCall(action, params = {}) {
      const headers = { 'Content-Type': 'application/json' };
      const token = localStorage.getItem('sb-token');
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 10000);
      try {
        const res = await fetch(API_BASE, { method: 'POST', headers, body: JSON.stringify({ action, ...params }), signal: controller.signal });
        clearTimeout(timeout);
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Request failed');
        return json.data !== undefined ? json.data : json;
      } catch (err) {
        clearTimeout(timeout);
        throw err;
      }
    }
    
    function esc(t) {
      if (!t) return '';
      return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    
    function buildFooter(footerData) {
      if (!footerData || !footerData.columns) return;
      const footerGrid = document.getElementById('footer-grid');
      const footerSocial = document.getElementById('footer-social');
      const logoCol = footerGrid.querySelector('.footer-col');
      
      footerGrid.innerHTML = logoCol.outerHTML + footerData.columns.map(function(col) {
        return '<div class="footer-col">' +
          '<h3>' + esc(col.heading) + '</h3>' +
          '<ul role="list">' +
          (col.items || []).map(function(item) {
            return '<li role="listitem">' +
              '<a href="' + esc(item.href || '#') + '">' +
              (item.icon ? '<i class="' + esc(item.icon) + '" style="color:var(--clr-magenta);margin-right:0.5rem" aria-hidden="true"></i>' : '') +
              esc(item.label) +
              '</a>' +
              '</li>';
          }).join('') +
          '</ul>' +
          '</div>';
      }).join('');
      
      if (footerSocial && footerData.social_links) {
        footerSocial.innerHTML = footerData.social_links.map(function(s) {
          return '<a href="' + esc(s.url) + '" aria-label="' + esc(s.platform || 'social media') + '" rel="noopener noreferrer" target="_blank" role="listitem">' +
            '<i class="' + esc(s.icon) + '" aria-hidden="true"></i>' +
            '</a>';
        }).join('');
      }
    }
    
    function buildBlogSection(blogData) {
      var container = document.getElementById('blog-content');
      
      if (!blogData || !blogData.posts || !blogData.posts.length) {
        container.innerHTML = '<div class="no-content" role="status">' +
          '<i class="fa-solid fa-newspaper" aria-hidden="true"></i>' +
          '<h1 class="section-title">Blog</h1>' +
          '<p>Articles coming soon. Subscribe to our newsletter to be notified when new content is published.</p>' +
          '</div>';
        return;
      }
      
      var title = esc(blogData.title || 'Articles & Insights');
      var subtitle = esc(blogData.subtitle || 'Stay updated with the latest in biology and pharmacy.');
      
      var postsHTML = blogData.posts.map(function(post) {
        var imageHTML = post.image_url ?
          '<div class="post-image" style="background-image:url(\'' + esc(post.image_url) + '\');" role="img" aria-label="' + esc(post.title) + ' featured image"></div>' :
          '';
        
        return '<article class="post-card">' +
          imageHTML +
          '<div class="post-body">' +
          '<h2>' + esc(post.title) + '</h2>' +
          '<p>' + esc(post.excerpt || '') + '</p>' +
          '<div class="post-meta">' +
          '<span><i class="fa-regular fa-user" aria-hidden="true"></i> ' + esc(post.author || 'AliverBiopharm') + '</span>' +
          '<span><i class="fa-regular fa-calendar" aria-hidden="true"></i> <time datetime="' + esc(post.date || '') + '">' + esc(post.date || '') + '</time></span>' +
          '</div>' +
          '<a href="' + esc(post.slug ? '/blog/' + post.slug : '#') + '" class="read-more" aria-label="Read more: ' + esc(post.title) + '">Read More <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>' +
          '</div>' +
          '</article>';
      }).join('');
      
      container.innerHTML = '<h1 class="section-title" id="blog-heading">' + title + '</h1>' +
        '<p class="section-subtitle">' + subtitle + '</p>' +
        '<div class="posts-grid" role="list" aria-label="Blog articles">' + postsHTML + '</div>' +
        '<aside class="newsletter-card" aria-labelledby="newsletter-heading">' +
        '<h2 id="newsletter-heading">Stay Updated</h2>' +
        '<p>Get the latest articles delivered to your inbox.</p>' +
        '<form class="newsletter-form" aria-label="Newsletter subscription">' +
        '<input type="email" placeholder="Your email address" required autocomplete="email" aria-label="Email for newsletter" />' +
        '<button type="submit">Subscribe</button>' +
        '</form>' +
        '</aside>';
      
      var newsletterForm = container.querySelector('.newsletter-form');
      if (newsletterForm) {
        newsletterForm.onsubmit = async function(e) {
          e.preventDefault();
          var emailInput = e.target.querySelector('input');
          var email = emailInput.value.trim();
          if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            alert('Please enter a valid email address.');
            return;
          }
          try {
            await apiCall('subscribe_newsletter', { formData: { email: email } });
            alert('✓ Subscribed successfully!');
            e.target.reset();
          } catch(err) {
            alert('Subscribed! Welcome aboard.');
            e.target.reset();
          }
        };
      }
    }
    
    document.addEventListener('DOMContentLoaded', async function() {
      document.getElementById('current-year').textContent = new Date().getFullYear();
      
      var themeToggle = document.getElementById('theme-toggle');
      var themeIcon = themeToggle.querySelector('i');
      
      if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-mode');
        themeIcon.classList.replace('fa-moon', 'fa-sun');
      }
      
      themeToggle.onclick = function() {
        document.body.classList.toggle('light-mode');
        var isLight = document.body.classList.contains('light-mode');
        if (isLight) {
          themeIcon.classList.replace('fa-moon', 'fa-sun');
          localStorage.setItem('theme', 'light');
        } else {
          themeIcon.classList.replace('fa-sun', 'fa-moon');
          localStorage.setItem('theme', 'dark');
        }
      };
      
      try {
        var sections = await apiCall('get_all_site_sections');
        
        if (sections) {
          if (sections.footer) {
            buildFooter(sections.footer);
          }
          
          var blogData = sections.blog;
          buildBlogSection(blogData);
        } else {
          document.getElementById('blog-content').innerHTML = '<div class="no-content" role="status"><i class="fa-solid fa-newspaper" aria-hidden="true"></i><h1 class="section-title">Blog</h1><p>Articles coming soon.</p></div>';
        }
      } catch(err) {
        console.error('Failed to load blog:', err);
        document.getElementById('blog-content').innerHTML = '<div class="error-state" role="alert"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><h1 class="section-title">Blog</h1><p>Unable to load articles. Please refresh the page or try again later.</p></div>';
      }
    });
  </script>
</body>
</html>
