-btn.selected{border-color:var(--clr-cyan);background:rgba(10,181,181,0.15)}.option-btn.correct{border-color:#10b981;background:rgba(16,185,129,0.15);color:#10b981}.option-btn.incorrect{border-color:#ef4444;background:rgba(239,68,68,0.15);color:#ef4444}.option-btn:disabled{cursor:not-allowed}.option-letter{width:32px;height:32px;border-radius:50%;background:var(--clr-navy-light);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}.progress-bar{width:100%;height:8px;background:rgba(10,181,181,0.12);border-radius:99px;overflow:hidden;margin-bottom:2rem}.progress-fill{height:100%;border-radius:99px;background:var(--gradient-cyan);transition:width 0.4s ease}.explanation-box{background:rgba(10,181,181,0.05);border:1px solid var(--clr-border-glow);border-radius:12px;padding:1rem;margin-top:0.5rem;font-size:0.85rem;color:var(--clr-text-dim);line-height:1.7}.result-score{font-family:var(--font-display);font-size:4rem;font-weight:900;color:var(--clr-cyan);text-align:center}.auth-overlay{text-align:center;padding:3rem}.footer-fat{background:rgba(255,255,255,0.92);border-top:1px solid var(--clr-border-glow);padding:2rem 1.5rem;margin-top:auto;text-align:center}body.dark-mode .footer-fat{background:#011f1f}@media(max-width:768px){.section{padding:40px 12px}.topic-grid{grid-template-columns:1fr}.header-container{padding:12px 16px}.result-score{font-size:3rem}}</style></head><body><header class="site-header"><div class="header-container"><a href="/" class="logo-link"><div class="logo-icon"><svg width="18" height="18" fill="none" stroke="#fff" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.75 3.104v5.714a2.25 2.25 0 01-.659 1.591L5 14.5M9.75 3.104c-.251.023-.501.05-.75.082m.75-.082a24.301 24.301 0 014.5 0m0 0v5.714c0 .597.237 1.17.659 1.591L19.8 15M14.25 3.104c.251.023.501.05.75.082"/></svg></div>Aliver<span class="g-text">Biopharm</span></a><button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button></div></header><main id="quiz-app"><div class="section" id="quiz-content"><span class="sec-label">ASSESSMENTS</span><h1 class="section-title">Knowledge Quizzes</h1><p style="text-align:center;color:var(--clr-text-dim);margin-bottom:2rem">Choose your level to start testing your knowledge.</p><div class="level-pills" id="level-pills"><button class="level-pill active" data-level="O-Level">O-Level Biology</button><button class="level-pill" data-level="A-Level">A-Level Biology</button><button class="level-pill" data-level="Pharmacy">Pharmacy</button></div><div id="dynamic-content"><p style="text-align:center;color:var(--clr-text-dim);padding:3rem">Loading topics...</p></div></div></main><footer class="footer-fat"><p style="font-size:0.8rem;color:var(--clr-text-muted)">&copy; <span id="current-year"></span> AliverBiopharm</p></footer><script>const API_BASE='/api/query';var currentUser=null,currentLevel='O-Level',currentTopic='',quizQuestions=[],userAnswers=[],currentIndex=0,quizStartTime=null;function esc(t){if(!t)return'';return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}async function apiCall(a,p){p=p||{};var h={'Content-Type':'application/json'};var t=localStorage.getItem('sb-token');if(t)h['Authorization']='Bearer '+t;var c=new AbortController();var o=setTimeout(function(){c.abort()},12000);try{var r=await fetch(API_BASE,{method:'POST',headers:h,body:JSON.stringify({action:a,...p}),signal:c.signal});clearTimeout(o);var j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j.data!==undefined?j.data:j}catch(e){clearTimeout(o);throw e}}async function checkAuth(){var t=localStorage.getItem('sb-token');if(!t||t.length<20)return null;try{var d=await apiCall('get_user');return d?.user||null}catch(e){return null}}function showAuth(){var m=document.createElement('div');m.style.cssText='position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8)';m.innerHTML='<div style="background:var(--clr-navy-card);border:2px solid var(--clr-cyan);border-radius:var(--radius-lg);padding:2rem;max-width:380px;width:90%"><button onclick="this.parentElement.parentElement.remove()" style="float:right;background:none;border:none;color:var(--clr-text-dim);cursor:pointer;font-size:1.2rem">✕</button><h3 style="color:var(--clr-cyan);margin-bottom:1rem;text-align:center">Sign In Required</h3><form id="auth-form" style="display:flex;flex-direction:column;gap:1rem"><input type="email" id="auth-email" placeholder="Email" required style="padding:12px;border-radius:12px;border:1.5px solid var(--clr-border-glow);background:rgba(236,248,248,0.9);color:var(--clr-white);font-family:var(--font-body)"><input type="password" id="auth-password" placeholder="Password" required minlength="6" style="padding:12px;border-radius:12px;border:1.5px solid var(--clr-border-glow);background:rgba(236,248,248,0.9);color:var(--clr-white);font-family:var(--font-body)"><button type="submit" class="btn-primary" style="justify-content:center">Sign In</button></form><p style="text-align:center;margin-top:1rem;color:var(--clr-text-dim);font-size:0.9rem">No account? <a href="#" id="switch-signup" style="color:var(--clr-magenta)">Sign up</a></p><p id="auth-error" style="color:#ef4444;text-align:center;margin-top:0.5rem;display:none"></p></div>';document.body.appendChild(m);document.getElementById('auth-form').onsubmit=async function(e){e.preventDefault();var em=document.getElementById('auth-email').value.trim(),pw=document.getElementById('auth-password').value,er=document.getElementById('auth-error');er.style.display='none';try{var d=await apiCall('signin',{email:em,password:pw});if(d.session){localStorage.setItem('sb-token',d.session.access_token);localStorage.setItem('sb-email',d.user.email);m.remove();currentUser=d.user;loadTopics(currentLevel)}else{er.textContent='Check your email to confirm signup.';er.style.display='block'}}catch(err){er.textContent=err.message;er.style.display='block'}};document.getElementById('switch-signup').onclick=function(e){e.preventDefault();m.remove();showAuthSignup()}}function showAuthSignup(){var m=document.createElement('div');m.style.cssText='position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8)';m.innerHTML='<div style="background:var(--clr-navy-card);border:2px solid var(--clr-cyan);border-radius:var(--radius-lg);padding:2rem;max-width:380px;width:90%"><button onclick="this.parentElement.parentElement.remove()" style="float:right;background:none;border:none;color:var(--clr-text-dim);cursor:pointer;font-size:1.2rem">✕</button><h3 style="color:var(--clr-cyan);margin-bottom:1rem;text-align:center">Create Account</h3><form id="signup-form" style="display:flex;flex-direction:column;gap:1rem"><input type="email" id="signup-email" placeholder="Email" required style="padding:12px;border-radius:12px;border:1.5px solid var(--clr-border-glow);background:rgba(236,248,248,0.9);color:var(--clr-white);font-family:var(--font-body)"><input type="password" id="signup-password" placeholder="Password (min 6 chars)" required minlength="6" style="padding:12px;border-radius:12px;border:1.5px solid var(--clr-border-glow);background:rgba(236,248,248,0.9);color:var(--clr-white);font-family:var(--font-body)"><button type="submit" class="btn-primary" style="justify-content:center">Create Account</button></form><p style="text-align:center;margin-top:1rem;color:var(--clr-text-dim);font-size:0.9rem">Have account? <a href="#" id="switch-signin" style="color:var(--clr-magenta)">Sign in</a></p><p id="signup-error" style="color:#ef4444;text-align:center;margin-top:0.5rem;display:none"></p></div>';document.body.appendChild(m);document.getElementById('signup-form').onsubmit=async function(e){e.preventDefault();var em=document.getElementById('signup-email').value.trim(),pw=document.getElementById('signup-password').value,er=document.getElementById('signup-error');er.style.display='none';try{var d=await apiCall('signup',{email:em,password:pw});if(d.session){localStorage.setItem('sb-token',d.session.access_token);localStorage.setItem('sb-email',d.user.email);m.remove();currentUser=d.user;loadTopics(currentLevel)}else{er.textContent='Check your email to confirm signup.';er.style.display='block'}}catch(err){er.textContent=err.message;er.style.display='block'}};document.getElementById('switch-signin').onclick=function(e){e.preventDefault();m.remove();showAuth()}}async function loadTopics(level){currentLevel=level;var c=document.getElementById('dynamic-content');c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">Loading topics...</p>';try{var topics=await apiCall('get_quiz_topics',{level:level});if(!topics||!topics.length){c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">No topics available for this level yet.</p>';return}c.innerHTML='<div class="topic-grid">'+topics.map(function(t){var count=t.question_count||'Multiple';return'<div class="topic-card" onclick="startQuiz(\''+esc(level)+'\',\''+esc(t.topic_name)+'\')"><h3>'+esc(t.topic_name)+'</h3><p>'+count+' questions available • Test your knowledge</p></div>'}).join('')+'</div>'}catch(e){c.innerHTML='<p style="text-align:center;color:var(--clr-magenta);padding:3rem">Failed to load topics. Please try again.</p>'}}async function startQuiz(level,topic){if(!currentUser){showAuth();return}try{var check=await apiCall('check_daily_retry',{level:level,topic:topic});if(!check.can_retry){alert(check.reason);return}}catch(e){}currentLevel=level;currentTopic=topic;var c=document.getElementById('dynamic-content');c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">Preparing your quiz...</p>';try{var questions=await apiCall('get_quiz_questions',{level:level,topic:topic,count:10});if(!questions||!questions.length){c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">No questions available for this topic yet. Check back soon!</p>';return}quizQuestions=questions;userAnswers=new Array(questions.length).fill(null);currentIndex=0;quizStartTime=new Date();renderQuestion()}catch(e){c.innerHTML='<p style="text-align:center;color:var(--clr-magenta);padding:3rem">Failed to load questions. Please try again.</p>'}}function renderQuestion(){var c=document.getElementById('dynamic-content');var q=quizQuestions[currentIndex];var p=((currentIndex)/quizQuestions.length)*100;var opts=['A','B','C','D'];var oh=opts.map(function(l,i){var a=userAnswers[currentIndex];var cls=a===l?' selected':'';var dis=a!==null?' disabled':'';return'<button class="option-btn'+cls+'" onclick="selectAnswer(\''+l+'\')"'+dis+'><span class="option-letter">'+l+'</span><span>'+esc(q['option_'+l.toLowerCase()])+'</span></button>'}).join('');c.innerHTML='<div style="max-width:800px;margin:0 auto"><div class="progress-bar"><div class="progress-fill" style="width:'+p+'%"></div></div><p style="font-size:0.8rem;color:var(--clr-text-muted);margin-bottom:1rem">Question '+(currentIndex+1)+' of '+quizQuestions.length+' • '+esc(currentTopic)+'</p><div class="question-card"><h2 style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:1.15rem;color:var(--clr-white);margin-bottom:1.2rem;line-height:1.6">'+esc(q.question_text)+'</h2>'+oh+'</div><div style="display:flex;gap:0.75rem;justify-content:space-between;margin-top:1rem">'+ (currentIndex>0?'<button class="btn-primary" style="background:var(--gradient-cyan);box-shadow:none" onclick="prevQuestion()">← Previous</button>':'<div></div>')+ (currentIndex<quizQuestions.length-1?'<button class="btn-primary" id="next-btn" onclick="nextQuestion()" '+(userAnswers[currentIndex]===null?'disabled':'')+'>Next →</button>':'<button class="btn-primary" id="submit-btn" onclick="submitQuiz()" '+(userAnswers[currentIndex]===null?'disabled':'')+'>Submit Quiz</button>')+'</div></div>'}function selectAnswer(l){userAnswers[currentIndex]=l;renderQuestion()}function nextQuestion(){if(currentIndex<quizQuestions.length-1){currentIndex++;renderQuestion()}}function prevQuestion(){if(currentIndex>0){currentIndex--;renderQuestion()}}async function submitQuiz(){var c=document.getElementById('dynamic-content');c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">Grading your answers...</p>';var answers=quizQuestions.map(function(q,i){return{id:q.id,selectedOption:userAnswers[i]||'X'}});var tt=Math.round((new Date()-quizStartTime)/1000);try{var result=await apiCall('submit_quiz_answers',{level:currentLevel,topic:currentTopic,answers:answers,time_taken:tt});renderResults(result)}catch(e){c.innerHTML='<p style="text-align:center;color:var(--clr-magenta);padding:3rem">Failed to submit quiz. Please try again.</p>'}}function renderResults(r){var c=document.getElementById('dynamic-content');var remark=r.passed?['Outstanding!','Excellent work!','Great job!','Well done!','Brilliant!'][Math.floor(Math.random()*5)]:['Keep studying!','Practice makes perfect!','Review and try again!','Learning takes time!','You will improve!'][Math.floor(Math.random()*5)];var ah=r.answers.map(function(a,i){var ic=a.isCorrect?'correct':'incorrect';var ui=a.isCorrect?'<i class="fa-solid fa-check" style="color:#10b981"></i>':'<i class="fa-solid fa-xmark" style="color:#ef4444"></i>';return'<div class="question-card" style="padding:1.2rem"><p style="font-weight:600;color:var(--clr-white);margin-bottom:0.75rem">'+(i+1)+'. '+esc(a.question)+'</p><p style="font-size:0.85rem;margin-bottom:0.25rem">Your answer: <span style="color:'+(a.isCorrect?'#10b981':'#ef4444')+';font-weight:600">'+esc(a.userAnswerText)+'</span> '+ui+'</p>'+(!a.isCorrect?'<p style="font-size:0.85rem;margin-bottom:0.5rem">Correct answer: <span style="color:#10b981;font-weight:600">'+esc(a.correctAnswerText)+'</span></p>':'')+'<div class="explanation-box"><strong>💡 Explanation:</strong> '+esc(a.explanation)+'</div>'+(!a.isCorrect?'<div class="explanation-box" style="margin-top:0.3rem"><strong>📝 Note:</strong> The answer you selected is incorrect. Review the explanation above to understand the correct concept better.</div>':'')+'</div>'}).join('');c.innerHTML='<div style="max-width:800px;margin:0 auto"><div class="question-card" style="text-align:center">'+ (r.passed?'<i class="fa-solid fa-trophy text-5xl" style="color:var(--clr-magenta);margin-bottom:1rem"></i>':'<i class="fa-solid fa-book-open text-5xl" style="color:var(--clr-cyan);margin-bottom:1rem"></i>')+'<h2 style="font-family:\'Playfair Display\',serif;font-size:1.5rem;color:var(--clr-white);margin-bottom:0.5rem">'+ (r.passed?'Congratulations!':'Quiz Complete')+'</h2><div class="result-score">'+r.percentage+'%</div><p style="color:var(--clr-text-dim);margin:0.5rem 0">'+r.score+' out of '+r.total+' correct</p><p style="font-size:0.9rem;color:var(--clr-text-dim);font-style:italic;margin-bottom:0.5rem">'+remark+'</p>'+ (r.passed?'<span style="display:inline-block;padding:4px 12px;border-radius:20px;background:rgba(16,185,129,0.15);color:#10b981;font-size:0.8rem;font-weight:600">✓ Passed</span>':'<span style="display:inline-block;padding:4px 12px;border-radius:20px;background:rgba(239,68,68,0.15);color:#ef4444;font-size:0.8rem;font-weight:600">✗ Try again tomorrow</span>')+'</div><h3 style="font-family:\'Playfair Display\',serif;font-size:1.2rem;color:var(--clr-white);margin:2rem 0 1rem">Detailed Review</h3>'+ah+'<div style="text-align:center;margin-top:2rem"><button class="btn-primary" onclick="loadTopics(currentLevel)">← Back to Topics</button></div></div>'}

document.addEventListener('DOMContentLoaded',async function(){document.getElementById('current-year').textContent=new Date().getFullYear();var tb=document.getElementById('theme-toggle'),ti=tb.querySelector('i');if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark-mode');ti.classList.replace('fa-moon','fa-sun')}tb.onclick=function(){document.body.classList.toggle('dark-mode');var d=document.body.classList.contains('dark-mode');if(d){ti.classList.replace('fa-moon','fa-sun');localStorage.setItem('theme','dark')}else{ti.classList.replace('fa-sun','fa-moon');localStorage.setItem('theme','light')}};document.querySelectorAll('.level-pill').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.level-pill').forEach(function(x){x.classList.remove('active')});this.classList.add('active');currentLevel=this.dataset.level;loadTopics(currentLevel)})});currentUser=await checkAuth();loadTopics(currentLevel)})</script></body></html>
