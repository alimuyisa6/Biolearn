function showSignup(){var m=document.createElement('div');m.style.cssText='position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8)';m.innerHTML='<div style="background:var(--clr-navy-card);border:2px solid var(--clr-cyan);border-radius:var(--radius-lg);padding:2rem;max-width:380px;width:90%"><button id="cs" style="float:right;background:none;border:none;color:var(--clr-text-dim);cursor:pointer;font-size:1.2rem">✕</button><h3 style="color:var(--clr-cyan);margin-bottom:1rem;text-align:center">Create Account</h3><form id="sf" style="display:flex;flex-direction:column;gap:1rem"><input type="email" id="se" placeholder="Email" required style="padding:12px;border-radius:12px;border:1.5px solid var(--clr-border-glow);background:rgba(236,248,248,0.9);color:var(--clr-white);font-family:var(--font-body)"><input type="password" id="sp" placeholder="Password (min 8 chars)" required minlength="8" style="padding:12px;border-radius:12px;border:1.5px solid var(--clr-border-glow);background:rgba(236,248,248,0.9);color:var(--clr-white);font-family:var(--font-body)"><button type="submit" class="btn-primary" style="justify-content:center">Create Account</button></form><p style="text-align:center;margin-top:1rem;color:var(--clr-text-dim);font-size:0.9rem">Have account? <button id="si" style="color:var(--clr-magenta);background:none;border:none;cursor:pointer;font-family:inherit;font-size:0.9rem;text-decoration:underline">Sign in</button></p><p id="ser" style="color:#ef4444;text-align:center;margin-top:0.5rem;display:none"></p></div>';document.body.appendChild(m);document.getElementById('cs').onclick=function(e){e.preventDefault();m.remove()};document.getElementById('sf').onsubmit=async function(e){e.preventDefault();var em=document.getElementById('se').value.trim(),pw=document.getElementById('sp').value,er=document.getElementById('ser');er.style.display='none';try{var d=await apiCall('signup',{email:em,password:pw});if(d&&d.session){localStorage.setItem('sb-token',d.session.access_token);localStorage.setItem('sb-email',d.user.email);m.remove();currentUser=d.user;loadTopics(currentLevel)}else{er.textContent='Check your email.';er.style.display='block'}}catch(err){er.textContent=err.message||'Signup failed';er.style.display='block'}};document.getElementById('si').onclick=function(e){e.preventDefault();m.remove();showAuth()}}
async function loadTopics(level){currentLevel=level;loadBlockStates();var c=document.getElementById('dynamic-content');c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">Loading topics...</p>';scrollToContent();try{var topics=await apiCall('get_quiz_topics',{level:level});if(!topics||!topics.length){c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">No topics available yet.</p>';return}if(!currentUser){c.innerHTML='<div style="text-align:center;padding:3rem"><i class="fa-solid fa-lock text-4xl" style="color:var(--clr-cyan);margin-bottom:1rem"></i><p style="color:var(--clr-text-dim);margin-bottom:1rem">Sign in to access quizzes.</p><button class="btn-primary" id="abtn">Sign In</button></div>';document.getElementById('abtn').onclick=function(e){e.preventDefault();showAuth()};return}c.innerHTML='<div class="topic-grid">'+topics.map(function(t){var qc=t.question_count||0;var tb=t.total_blocks||0;var hasQ=qc>0&&tb>0;var allDone=hasQ;if(hasQ)for(var i=0;i<tb;i++){if(!isBlockDone(i)){allDone=false;break}}if(hasQ&&!allDone)return'<div class="topic-card clickable" data-topic="'+esc(t.topic_name)+'" data-tb="'+tb+'"><h3>'+esc(t.topic_name)+'</h3><span class="q-count ready">'+qc+' questions • '+tb+' blocks</span><small style="color:var(--clr-cyan)">Tap to start →</small></div>';return'<div class="topic-card"><h3>'+esc(t.topic_name)+'</h3><span class="q-count">'+qc+' questions</span><small>'+(allDone?'All blocks done!':'Questions being added')+'</small></div>'}).join('')+'</div>';c.querySelectorAll('.topic-card.clickable').forEach(function(card){card.onclick=function(e){e.preventDefault();openTopicBlocks(level,this.dataset.topic,parseInt(this.dataset.tb))}})}catch(e){c.innerHTML='<p style="text-align:center;color:var(--clr-magenta);padding:3rem">Failed to load topics.</p>'}}
function openTopicBlocks(level,topic,total){currentLevel=level;currentTopic=topic;totalBlocks=total;loadBlockStates();var c=document.getElementById('dynamic-content');var h='<div style="max-width:800px;margin:0 auto"><h2 style="font-family:\'Playfair Display\',serif;font-size:1.5rem;color:var(--clr-white);text-align:center;margin-bottom:0.5rem">'+esc(topic)+'</h2><p style="text-align:center;color:var(--clr-text-dim);margin-bottom:1.5rem">Each block has 10 questions.</p><div class="block-nav">';for(var i=0;i<total;i++){var locked=isBlockLocked(i);var done=isBlockDone(i);var cls='';var label='Block '+(i+1);var dis='';if(locked){cls='locked';label='🔒 Block '+(i+1);dis='disabled'}else if(done){cls='completed';label='✓ Block '+(i+1)}h+='<button class="block-nav-btn '+cls+'" data-bn="'+i+'" '+dis+'>'+label+'</button>'}h+='</div><div style="text-align:center;margin-top:1.5rem"><button class="btn-secondary" id="bt">← Back</button></div></div>';c.innerHTML=h;scrollToContent();document.getElementById('bt').onclick=function(e){e.preventDefault();loadTopics(currentLevel)};c.querySelectorAll('.block-nav-btn:not([disabled])').forEach(function(b){b.onclick=function(e){e.preventDefault();startBlock(parseInt(this.dataset.bn))}})}
async function startBlock(blockNum){if(!currentUser){showAuth();return}if(isBlockLocked(blockNum)){alert('Locked until tomorrow.');return}currentBlock=blockNum;var c=document.getElementById('dynamic-content');c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">Loading Block '+(blockNum+1)+'...</p>';try{var data=await apiCall('get_quiz_block',{level:currentLevel,topic:currentTopic,block_number:blockNum});if(!data||!data.questions||!data.questions.length){c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">No questions yet.</p>';return}quizQuestions=data.questions;userAnswers=new Array(data.questions.length).fill(null);currentIndex=0;quizStartTime=new Date();scrollToContent();renderQuestion()}catch(e){c.innerHTML='<p style="text-align:center;color:var(--clr-magenta);padding:3rem">Failed: '+esc(e.message)+'</p>'}}
function renderQuestion(){var c=document.getElementById('dynamic-content');var q=quizQuestions[currentIndex];var p=(currentIndex/quizQuestions.length)*100;var answered=userAnswers[currentIndex]!==null;var answerData=userAnswers[currentIndex];var selected=answerData?.selected;var opts=['A','B','C','D'];var oh=opts.map(function(l){var cls='';var icon='';if(answered){if(l===answerData.correct_option){cls=' correct';icon=' <i class="fa-solid fa-circle-check" style="color:#10b981;margin-left:auto"></i>'}else if(l===selected){cls=' incorrect';icon=' <i class="fa-solid fa-circle-xmark" style="color:#ef4444;margin-left:auto"></i>'}}var dis=answered?' disabled':'';return'<button class="option-btn'+cls+'" data-opt="'+l+'" '+dis+'><span class="option-letter">'+l+'</span><span>'+esc(q['option_'+l.toLowerCase()])+'</span>'+icon+'</button>'}).join('');c.innerHTML='<div style="max-width:800px;margin:0 auto"><div class="progress-bar"><div class="progress-fill" style="width:'+p+'%"></div></div><p style="font-size:0.8rem;color:var(--clr-text-muted);margin-bottom:0.5rem">Block '+(currentBlock+1)+' • Q '+(currentIndex+1)+'/'+quizQuestions.length+'</p><p style="font-size:0.75rem;color:var(--clr-text-muted);margin-bottom:1rem">'+esc(currentTopic)+'</p><div class="question-card"><h2 style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:1.15rem;color:var(--clr-white);margin-bottom:1.2rem;line-height:1.6">'+esc(q.question_text)+'</h2>'+oh+'</div><div style="display:flex;gap:0.75rem;justify-content:space-between;margin-top:1rem">'+(currentIndex>0?'<button class="btn-secondary" id="pv">← Prev</button>':'<div></div>')+(answered?(currentIndex<quizQuestions.length-1?'<button class="btn-primary" id="nx">Next →</button>':'<button class="btn-primary" id="sb">Submit Block</button>'):'<span style="font-size:0.8rem;color:var(--clr-text-muted)">Select an answer</span>')+'</div></div>';if(!answered){c.querySelectorAll('.option-btn').forEach(function(b){b.onclick=function(e){e.preventDefault();selectAnswer(this.dataset.opt)}})}if(document.getElementById('pv'))document.getElementById('pv').onclick=function(e){e.preventDefault();prevQuestion()};if(document.getElementById('nx'))document.getElementById('nx').onclick=function(e){e.preventDefault();nextQuestion()};if(document.getElementById('sb'))document.getElementById('sb').onclick=function(e){e.preventDefault();submitBlock()}}
async function selectAnswer(l){if(userAnswers[currentIndex]!==null)return;var q=quizQuestions[currentIndex];var btns=document.querySelectorAll('.option-btn');btns.forEach(function(b){b.disabled=true;b.style.pointerEvents='none'});var targetBtn=document.querySelector('.option-btn[data-opt="'+l+'"]');if(targetBtn){targetBtn.style.borderColor='var(--clr-cyan)';targetBtn.style.background='rgba(10,181,181,0.1)';var spinner=document.createElement('span');spinner.className='answer-spinner';var spinnerText=document.createElement('span');spinnerText.className='spinner-text';spinnerText.innerHTML='<span class="spinner-words">'+getRandomSpinnerWord()+'</span>';targetBtn.appendChild(spinner);targetBtn.appendChild(spinnerText)}try{var result=await apiCall('check_quiz_answer',{question_id:q.id,selected_option:l});userAnswers[currentIndex]={selected:l,correct:result.correct,correct_option:result.correct_option,correct_answer_text:result.correct_answer_text};renderQuestion()}catch(e){alert('Failed to verify answer. Please try again.');btns.forEach(function(b){b.disabled=false;b.style.pointerEvents='auto'});var sp=targetBtn?.querySelector('.answer-spinner');var st=targetBtn?.querySelector('.spinner-text');if(sp)sp.remove();if(st)st.remove()}}
function nextQuestion(){if(currentIndex<quizQuestions.length-1){currentIndex++;scrollToContent();renderQuestion()}}
function prevQuestion(){if(currentIndex>0){currentIndex--;scrollToContent();renderQuestion()}}
async function submitBlock(){var c=document.getElementById('dynamic-content');c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">Saving...</p>';var answers=quizQuestions.map(function(q,i){return{id:q.id,selectedOption:userAnswers[i]?.selected||'X'}});var tt=Math.round((new Date()-quizStartTime)/1000);try{var result=await apiCall('submit_quiz_block',{level:currentLevel,topic:currentTopic,block_number:currentBlock,answers:answers,time_taken:tt});if(!result){c.innerHTML='<p style="text-align:center;color:var(--clr-magenta);padding:3rem">No response.</p>';return}markBlockComplete(currentBlock,result.percentage);lockBlock(currentBlock);scrollToContent();renderBlockResults(result)}catch(e){c.innerHTML='<p style="text-align:center;color:var(--clr-magenta);padding:3rem">Failed: '+esc(e.message)+'</p>'}}
function renderBlockResults(r){var c=document.getElementById('dynamic-content');var un=getUserName();var passed=r.passed;var icon=passed?'fa-trophy':'fa-book-open';var icls=passed?'result-pass':'result-fail';var title=passed?'Congratulations, '+un+'!':'Block Complete, '+un;var remark=passed?['Outstanding! You really know this!','Excellent work! Your understanding is impressive!','Great job! You\'ve mastered this material!','Well done! Your dedication shows!','Brilliant! Keep up the amazing progress!'][Math.floor(Math.random()*5)]:['Keep studying! Every expert was once a beginner.','Practice makes perfect — review and try tomorrow!','Learning takes time. Study the explanations below!','You\'ll improve! Each attempt teaches something new.','Mistakes help us grow. Review and come back stronger!'][Math.floor(Math.random()*5)];var ah=r.answers.map(function(a,i){var iHtml=a.isCorrect?'<i class="fa-solid fa-circle-check" style="color:#10b981;font-size:1.2rem"></i>':'<i class="fa-solid fa-circle-xmark" style="color:#ef4444;font-size:1.2rem"></i>';return'<div class="question-card" style="padding:1.2rem"><div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem">'+iHtml+'<p style="font-weight:600;color:var(--clr-white)">Q'+(i+1)+'</p></div><p style="color:var(--clr-white);margin-bottom:0.75rem">'+esc(a.question)+'</p><p style="font-size:0.85rem">Your answer: <span style="color:'+(a.isCorrect?'#10b981':'#ef4444')+';font-weight:600">'+esc(a.userAnswerText)+'</span></p>'+(!a.isCorrect?'<p style="font-size:0.85rem;margin-bottom:0.5rem">Correct: <span style="color:#10b981;font-weight:600">'+esc(a.correctAnswerText)+'</span></p>':'')+'<div class="explanation-box">💡 '+esc(a.explanation)+'</div></div>'}).join('');var nb=currentBlock+1;var cc=nb<totalBlocks&&!isBlockLocked(nb);c.innerHTML='<div style="max-width:800px;margin:0 auto"><div class="question-card" style="text-align:center"><i class="fa-solid '+icon+' result-icon '+icls+'"></i><h2 style="font-family:\'Playfair Display\',serif;font-size:1.5rem;color:var(--clr-white);margin-bottom:0.5rem">'+title+'</h2><div class="result-score">'+r.percentage+'%</div><p style="color:var(--clr-text-dim);margin:0.5rem 0">'+r.score+'/'+r.total+' correct</p><p style="font-size:0.9rem;color:var(--clr-text-dim);font-style:italic;margin-bottom:0.5rem">'+remark+'</p><span class="status-badge '+(passed?'status-pass':'status-fail')+'">'+(passed?'✓ Passed':'✗ Not passed')+'</span></div><h3 style="font-family:\'Playfair Display\',serif;font-size:1.2rem;color:var(--clr-white);margin:2rem 0 1rem">Block '+(r.block_number+1)+' Review</h3>'+ah+'<div style="text-align:center;margin-top:2rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">'+(cc?'<button class="btn-primary" id="nb">Next Block →</button>':'')+'<button class="btn-secondary" id="ab">All Blocks</button><button class="btn-secondary" id="bt2">← Topics</button></div></div>';if(document.getElementById('nb'))document.getElementById('nb').onclick=function(e){e.preventDefault();startBlock(nb)};if(document.getElementById('ab'))document.getElementById('ab').onclick=function(e){e.preventDefault();openTopicBlocks(currentLevel,currentTopic,totalBlocks)};if(document.getElementById('bt2'))document.getElementById('bt2').onclick=function(e){e.preventDefault();loadTopics(currentLevel)}}

document.addEventListener('DOMContentLoaded',async function(){document.getElementById('current-year').textContent=new Date().getFullYear();var tb=document.getElementById('theme-toggle'),ti=tb.querySelector('i');if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark-mode');ti.classList.replace('fa-moon','fa-sun')}tb.onclick=function(e){e.preventDefault();document.body.classList.toggle('dark-mode');var d=document.body.classList.contains('dark-mode');if(d){ti.classList.replace('fa-moon','fa-sun');localStorage.setItem('theme','dark')}else{ti.classList.replace('fa-sun','fa-moon');localStorage.setItem('theme','light')}};document.querySelectorAll('.level-pill').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();document.querySelectorAll('.level-pill').forEach(function(x){x.classList.remove('active')});this.classList.add('active');currentLevel=this.dataset.level;loadTopics(currentLevel)})});loadFooter();loadSiteLogo();currentUser=await checkAuth();loadTopics(currentLevel)})
</script></body></html>
