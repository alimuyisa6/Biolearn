function showSignup(){var m=document.createElement('div');m.style.cssText='position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8)';m.innerHTML='<div style="background:var(--clr-navy-card);border:2px solid var(--clr-cyan);border-radius:var(--radius-lg);padding:2rem;max-width:380px;width:90%"><button onclick="this.parentElement.parentElement.remove()" style="float:right;background:none;border:none;color:var(--clr-text-dim);cursor:pointer;font-size:1.2rem">✕</button><h3 style="color:var(--clr-cyan);margin-bottom:1rem;text-align:center">Create Account</h3><form id="signup-form" style="display:flex;flex-direction:column;gap:1rem"><input type="email" id="signup-email" placeholder="Email" required style="padding:12px;border-radius:12px;border:1.5px solid var(--clr-border-glow);background:rgba(236,248,248,0.9);color:var(--clr-white);font-family:var(--font-body)"><input type="password" id="signup-password" placeholder="Password (min 8 chars)" required minlength="8" style="padding:12px;border-radius:12px;border:1.5px solid var(--clr-border-glow);background:rgba(236,248,248,0.9);color:var(--clr-white);font-family:var(--font-body)"><button type="submit" class="btn-primary" style="justify-content:center">Create Account</button></form><p style="text-align:center;margin-top:1rem;color:var(--clr-text-dim);font-size:0.9rem">Have account? <a href="#" id="switch-signin" style="color:var(--clr-magenta)">Sign in</a></p><p id="signup-error" style="color:#ef4444;text-align:center;margin-top:0.5rem;display:none"></p></div>';document.body.appendChild(m);document.getElementById('signup-form').onsubmit=async function(e){e.preventDefault();var em=document.getElementById('signup-email').value.trim(),pw=document.getElementById('signup-password').value,er=document.getElementById('signup-error');er.style.display='none';try{var d=await apiCall('signup',{email:em,password:pw});if(d&&d.session){localStorage.setItem('sb-token',d.session.access_token);localStorage.setItem('sb-email',d.user.email);m.remove();currentUser=d.user;loadTopics(currentLevel)}else{er.textContent='Check your email to confirm signup.';er.style.display='block'}}catch(err){er.textContent=err.message||'Signup failed';er.style.display='block'}};document.getElementById('switch-signin').onclick=function(e){e.preventDefault();m.remove();showAuth()}}
async function loadTopics(level){currentLevel=level;loadBlockStates();var c=document.getElementById('dynamic-content');c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">Loading topics...</p>';try{var topics=await apiCall('get_quiz_topics',{level:level});if(!topics||!topics.length){c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">No topics available for this level yet.</p>';return}if(!currentUser){c.innerHTML='<div style="text-align:center;padding:3rem"><i class="fa-solid fa-lock text-4xl" style="color:var(--clr-cyan);margin-bottom:1rem"></i><p style="color:var(--clr-text-dim);margin-bottom:1rem">Sign in to access quizzes and track your progress.</p><button class="btn-primary" onclick="showAuth()"><i class="fa-solid fa-right-to-bracket"></i> Sign In to Continue</button></div>';return}c.innerHTML='<div class="topic-grid">'+topics.map(function(t){var qc=t.question_count||0;var tb=t.total_blocks||0;var cb=t.completed_blocks||0;var hasQ=qc>0&&tb>0;var allDone=hasQ&&cb>=tb;var cardClass=hasQ&&!allDone?'clickable':'';var lockedClass=allDone?'locked':'';var blockInfo='';if(hasQ){blockInfo='<div class="block-info">';for(var i=0;i<tb;i++){var badgeClass='available';var badgeText='Block '+(i+1);if(i<cb||isBlockLocked(i)){badgeClass='completed';badgeText='✓ Block '+(i+1)}blockInfo+='<span class="block-badge '+badgeClass+'">'+badgeText+'</span>'}blockInfo+='</div>'}var statusText=hasQ?qc+' questions • '+tb+' block'+(tb>1?'s':''):'No questions yet';var onclick=hasQ&&!allDone?('onclick="openTopicBlocks(\''+esc(level)+'\',\''+esc(t.topic_name)+'\','+tb+')"'):'';return'<div class="topic-card '+cardClass+' '+lockedClass+'" '+onclick+'><h3>'+esc(t.topic_name)+'</h3><span class="q-count '+(hasQ?'ready':'')+'">'+statusText+'</span>'+blockInfo+(allDone?'<small style="color:#10b981">All blocks completed!</small>':(hasQ?'<small style="color:var(--clr-cyan)">Tap to start →</small>':'<small class="no-questions">Questions being added</small>'))+'</div>'}).join('')+'</div>'}catch(e){c.innerHTML='<p style="text-align:center;color:var(--clr-magenta);padding:3rem">Failed to load topics. Please try again.</p>'}}
function openTopicBlocks(level,topic,total){currentLevel=level;currentTopic=topic;totalBlocks=total;loadBlockStates();var c=document.getElementById('dynamic-content');c.innerHTML='<div style="max-width:800px;margin:0 auto"><h2 style="font-family:\'Playfair Display\',serif;font-size:1.5rem;color:var(--clr-white);text-align:center;margin-bottom:0.5rem">'+esc(topic)+'</h2><p style="text-align:center;color:var(--clr-text-dim);margin-bottom:1.5rem">Select a block of 10 questions. 🔒 = locked until tomorrow.</p><div class="block-nav">';for(var i=0;i<total;i++){var status=getBlockStatus(i);var cls=status==='locked'?'locked':(status==='completed'?'completed':'available');var label=status==='locked'?'🔒 Block '+(i+1):(status==='completed'?'✓ Block '+(i+1):'Block '+(i+1));c.innerHTML+='<button class="block-nav-btn '+cls+'" onclick="startBlock('+i+')" '+(status==='locked'?'disabled':'')+'>'+label+'</button>'}c.innerHTML+='</div><div style="text-align:center;margin-top:1.5rem"><button class="btn-secondary" onclick="loadTopics(currentLevel)">← Back to Topics</button></div></div>'}
async function startBlock(blockNum){if(!currentUser){showAuth();return}if(isBlockLocked(blockNum)){alert('This block is locked until tomorrow. Please try again after 24 hours.');return}currentBlock=blockNum;var c=document.getElementById('dynamic-content');c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">Loading Block '+(blockNum+1)+' questions...</p>';try{var data=await apiCall('get_quiz_block',{level:currentLevel,topic:currentTopic,block_number:blockNum});if(!data||!data.questions||!data.questions.length){c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem">No questions in this block yet. Check back soon!</p>';return}quizQuestions=data.questions;userAnswers=new Array(data.questions.length).fill(null);quizAnswerCorrect=new Array(data.questions.length).fill(null);currentIndex=0;quizStartTime=new Date();renderQuestion()}catch(e){c.innerHTML='<p style="text-align:center;color:var(--clr-magenta);padding:3rem">Failed to load block: '+esc(e.message)+'</p>'}}
function renderQuestion(){var c=document.getElementById('dynamic-content');var q=quizQuestions[currentIndex];var p=((currentIndex)/quizQuestions.length)*100;var correctAnswer=q.correct_option||q.correctOption||null;var opts=['A','B','C','D'];var oh=opts.map(function(l){var isRevealed=quizAnswerCorrect[currentIndex]!==null;var isCorrectOpt=isRevealed&&l===correctAnswer;var isSelectedWrong=isRevealed&&userAnswers[currentIndex]===l&&l!==correctAnswer;var cls='';if(isRevealed&&isCorrectOpt)cls=' correct';else if(isSelectedWrong)cls=' incorrect';else if(!isRevealed&&userAnswers[currentIndex]===l)cls=' selected';var dis=isRevealed?' disabled':'';return'<button class="option-btn'+cls+'" onclick="selectAnswer(\''+l+'\')"'+dis+'><span class="option-letter">'+l+'</span><span>'+esc(q['option_'+l.toLowerCase()])+'</span>'+(isRevealed&&isCorrectOpt?' <i class="fa-solid fa-circle-check" style="color:#10b981;margin-left:auto"></i>':'')+(isSelectedWrong?' <i class="fa-solid fa-circle-xmark" style="color:#ef4444;margin-left:auto"></i>':'')+'</button>'}).join('');c.innerHTML='<div style="max-width:800px;margin:0 auto"><div class="progress-bar"><div class="progress-fill" style="width:'+p+'%"></div></div><p style="font-size:0.8rem;color:var(--clr-text-muted);margin-bottom:0.5rem">Block '+(currentBlock+1)+' • Question '+(currentIndex+1)+' of '+quizQuestions.length+'</p><p style="font-size:0.75rem;color:var(--clr-text-muted);margin-bottom:1rem">'+esc(currentTopic)+'</p><div class="question-card"><h2 style="font-family:\'Playfair Display\',serif;font-weight:700;font-size:1.15rem;color:var(--clr-white);margin-bottom:1.2rem;line-height:1.6">'+esc(q.question_text)+'</h2>'+oh+'</div><div style="display:flex;gap:0.75rem;justify-content:space-between;margin-top:1rem">'+(currentIndex>0?'<button class="btn-secondary" onclick="prevQuestion()">← Previous</button>':'<div></div>')+(quizAnswerCorrect[currentIndex]!==null?(currentIndex<quizQuestions.length-1?'<button class="btn-primary" onclick="nextQuestion()">Next →</button>':'<button class="btn-primary" onclick="submitBlock()">Submit Block</button>'):'<span style="font-size:0.8rem;color:var(--clr-text-muted)">Select an answer to continue</span>')+'</div></div>'}
function selectAnswer(l){if(quizAnswerCorrect[currentIndex]!==null)return;userAnswers[currentIndex]=l;var q=quizQuestions[currentIndex];var correctAnswer=q.correct_option||q.correctOption||null;var isCorrect=l===correctAnswer;quizAnswerCorrect[currentIndex]=isCorrect;setTimeout(function(){renderQuestion()},300)}
function nextQuestion(){if(currentIndex<quizQuestions.length-1){currentIndex++;renderQuestion()}}
function prevQuestion(){if(currentIndex>0){currentIndex--;renderQuestion()}}
async function submitBlock(){var c=document.getElementById('dynamic-content');c.innerHTML='<p style="text-align:center;color:var(--clr-text-dim);padding:3rem"><i class="fa-solid fa-spinner fa-spin"></i> Saving your results...</p>';var answers=quizQuestions.map(function(q,i){return{id:q.id,selectedOption:userAnswers[i]||'X'}});var tt=Math.round((new Date()-quizStartTime)/1000);lockBlock(currentBlock);try{var result=await apiCall('submit_quiz_block',{level:currentLevel,topic:currentTopic,block_number:currentBlock,answers:answers,time_taken:tt});if(!result){c.innerHTML='<p style="text-align:center;color:var(--clr-magenta);padding:3rem">No response from server. Please try again.</p>';return}renderBlockResults(result)}catch(e){console.error('Submit error:',e);c.innerHTML='<p style="text-align:center;color:var(--clr-magenta);padding:3rem">Failed to submit block: '+esc(e.message)+'. Please try again.</p>'}}
function renderBlockResults(r){var c=document.getElementById('dynamic-content');var un=getUserName();var passed=r.passed;var iconClass=passed?'result-pass':'result-fail';var icon=passed?'fa-trophy':'fa-book-open';var title=passed?'Congratulations, '+un+'!':'Block Complete, '+un;var remark=passed?['Outstanding! You really know this topic!','Excellent work! Your understanding is impressive!','Great job! You have mastered this material!','Well done! Your hard work shows!','Brilliant! Keep up the amazing progress!'][Math.floor(Math.random()*5)]:['Keep studying! Every expert was once a beginner.','Practice makes perfect — try again tomorrow!','Review the material and come back stronger!','Learning takes time. You will improve!','Mistakes help us learn. Study the explanations!'][Math.floor(Math.random()*5)];var ah=r.answers.map(function(a,i){var ic=a.isCorrect?'correct':'incorrect';var iconHtml=a.isCorrect?'<i class="fa-solid fa-circle-check" style="color:#10b981;font-size:1.2rem"></i>':'<i class="fa-solid fa-circle-xmark" style="color:#ef4444;font-size:1.2rem"></i>';return'<div class="question-card" style="padding:1.2rem"><div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem">'+iconHtml+'<p style="font-weight:600;color:var(--clr-white)">Question '+(i+1)+'</p></div><p style="color:var(--clr-white);margin-bottom:0.75rem;line-height:1.5">'+esc(a.question)+'</p><p style="font-size:0.85rem;margin-bottom:0.25rem">Your answer: <span style="color:'+(a.isCorrect?'#10b981':'#ef4444')+';font-weight:600">'+esc(a.userAnswerText)+'</span></p>'+(!a.isCorrect?'<p style="font-size:0.85rem;margin-bottom:0.5rem">Correct answer: <span style="color:#10b981;font-weight:600">'+esc(a.correctAnswerText)+'</span></p>':'')+'<div class="explanation-box"><strong>💡 Explanation:</strong> '+esc(a.explanation)+'</div>'+(!a.isCorrect?'<div class="explanation-box" style="margin-top:0.3rem"><strong>📝 Note:</strong> Your choice was incorrect. Study the explanation above to understand why the correct answer is right and avoid this mistake next time.</div>':'')+'</div>'}).join('');var nextBlock=currentBlock+1;var canContinue=nextBlock<totalBlocks&&!isBlockLocked(nextBlock);c.innerHTML='<div style="max-width:800px;margin:0 auto"><div class="question-card" style="text-align:center"><i class="fa-solid '+icon+' result-icon '+iconClass+'"></i><h2 style="font-family:\'Playfair Display\',serif;font-size:1.5rem;color:var(--clr-white);margin-bottom:0.5rem">'+title+'</h2><div class="result-score">'+r.percentage+'%</div><p style="color:var(--clr-text-dim);margin:0.5rem 0">'+r.score+' out of '+r.total+' correct</p><p style="font-size:0.9rem;color:var(--clr-text-dim);font-style:italic;margin-bottom:0.5rem">'+remark+'</p><span class="status-badge '+(passed?'status-pass':'status-fail')+'">'+(passed?'✓ Passed — 70% or above':'✗ Not passed — Below 70%')+'</span></div><h3 style="font-family:\'Playfair Display\',serif;font-size:1.2rem;color:var(--clr-white);margin:2rem 0 1rem">Block '+(r.block_number+1)+' Review</h3>'+ah+'<div style="text-align:center;margin-top:2rem;display:flex;gap:1rem;justify-content:center;flex-wrap:wrap">'+(canContinue?'<button class="btn-primary" onclick="startBlock('+nextBlock+')">Next Block →</button>':'')+'<button class="btn-secondary" onclick="openTopicBlocks(currentLevel,currentTopic,totalBlocks)">All Blocks</button><button class="btn-secondary" onclick="loadTopics(currentLevel)">← Topics</button></div></div>'}

document.addEventListener('DOMContentLoaded',async function(){document.getElementById('current-year').textContent=new Date().getFullYear();var tb=document.getElementById('theme-toggle'),ti=tb.querySelector('i');if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark-mode');ti.classList.replace('fa-moon','fa-sun')}tb.onclick=function(){document.body.classList.toggle('dark-mode');var d=document.body.classList.contains('dark-mode');if(d){ti.classList.replace('fa-moon','fa-sun');localStorage.setItem('theme','dark')}else{ti.classList.replace('fa-sun','fa-moon');localStorage.setItem('theme','light')}};document.querySelectorAll('.level-pill').forEach(function(b){b.addEventListener('click',function(e){e.preventDefault();document.querySelectorAll('.level-pill').forEach(function(x){x.classList.remove('active')});this.classList.add('active');currentLevel=this.dataset.level;loadTopics(currentLevel)})});loadFooter();currentUser=await checkAuth();loadTopics(currentLevel)})
</script></body></html>
