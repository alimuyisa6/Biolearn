<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title id="page-title">Loading Note... | AliverBiopharm</title>
<meta name="description" id="meta-description" content="Expert-written study notes for biology and pharmacy students.">
<meta name="robots" content="index, follow">
<link rel="canonical" id="canonical-url" href="https://aliverbiopharm.com/">
<meta property="og:title" id="og-title" content="AliverBiopharm Study Notes">
<meta property="og:description" id="og-description" content="Comprehensive study notes with interactive features.">
<meta name="theme-color" id="theme-color" content="#0a7e7e">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --clr-deep-space: #eef7f7;
  --clr-cyan: #0a7e7e;
  --clr-magenta: #b8873a;
  --clr-navy-card: rgba(255, 255, 255, 0.85);
  --clr-navy-light: rgba(10, 129, 129, 0.08);
  --clr-white: #0d2e2e;
  --clr-text-dim: #2d5c5c;
  --clr-text-muted: #4a6f6f;
  --clr-border-glow: rgba(10, 129, 129, 0.15);
  --max-width: 1000px;
  --radius-lg: 1.4rem;
  --gradient-cyan: linear-gradient(135deg, #0a7e7e, #0a5f5f);
  --gradient-magenta: linear-gradient(135deg, #b8873a, #c28b2c);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--clr-deep-space);
  color: var(--clr-white);
  font-family: 'Inter', sans-serif;
  line-height: 1.7;
}
.site-header {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(238, 247, 247, 0.92);
  backdrop-filter: blur(22px);
  border-bottom: 3px solid var(--clr-magenta);
  height: 65px;
}
.header-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 65px;
}
.logo-link {
  font-size: 1.7rem;
  font-weight: 800;
  text-decoration: none;
  letter-spacing: -0.3px;
  line-height: 1.2;
  display: inline-block;
  max-width: 100%;
  white-space: nowrap;
}
.logo-link img { 
  height: 45px; 
  width: auto;
  max-height: 50px;
  object-fit: contain;
}
.main-nav { display: flex; gap: 32px; list-style: none; }
.main-nav a {
  color: var(--clr-text-dim);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.2s;
}
.main-nav a:hover { color: var(--clr-magenta); }
.note-container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 100px 0 60px;
}
.note-header { margin-bottom: 40px; text-align: center; }
.level-badge {
  display: inline-block;
  background: var(--gradient-magenta);
  color: #fff;
  padding: 6px 20px;
  border-radius: 40px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.note-title {
  font-family: 'Poppins', sans-serif;
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 800;
  margin-bottom: 16px;
}
.note-content {
  background: var(--clr-navy-card);
  border-radius: 24px;
  padding: 48px;
  border: 1px solid var(--clr-border-glow);
  font-size: 0.95rem;
  line-height: 1.7;
}
.note-content h1, .note-content h2, .note-content h3 {
  font-family: 'Poppins', sans-serif;
  margin: 32px 0 16px;
}
.note-content h1 { font-size: 1.8rem; }
.note-content h2 { font-size: 1.4rem; color: var(--clr-cyan); }
.note-content h3 { font-size: 1.2rem; color: var(--clr-magenta); }
.note-content p { margin-bottom: 20px; color: var(--clr-text-dim); line-height: 1.8; }
.note-content ul, .note-content ol { margin: 16px 0 16px 32px; }
@media (max-width: 768px) {
  .note-content { padding: 20px; font-size: 0.85rem; }
  .note-content h1 { font-size: 1.4rem; }
  .note-content h2 { font-size: 1.2rem; }
  .note-content h3 { font-size: 1rem; }
}
.reaction-bar {
  display: flex;
  gap: 12px;
  margin: 32px 0 24px;
  flex-wrap: wrap;
}
.reaction-btn {
  background: none;
  border: none;
  border-radius: 40px;
  padding: 6px 16px;
  font-weight: 500;
  font-size: 0.85rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--clr-text-dim);
  transition: all 0.2s;
}
.reaction-btn:hover { background: var(--clr-navy-light); transform: translateY(-2px); }
.reaction-btn.active { background: var(--gradient-cyan); border-color: transparent; color: #fff; }
.comment-section { 
  margin-top: 20px;
  width: 100%;
  overflow-x: hidden;
}
.comment-input-group {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: nowrap;
  width: 100%;
}
.comment-input-group input {
  flex: 1;
  min-width: 0;
  padding: 10px 18px;
  border-radius: 50px;
  border: 1px solid var(--clr-border-glow);
  background: var(--clr-navy-card);
  color: var(--clr-white);
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
}
.comment-submit {
  background: var(--gradient-cyan);
  border: none;
  padding: 0 24px;
  border-radius: 50px;
  color: #fff;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.2s;
}
.comment-submit:hover { opacity: 0.9; }
.comments-list { max-height: 300px; overflow-y: auto; }
.comment-item {
  padding: 12px 0;
  border-bottom: 1px solid var(--clr-border-glow);
  font-size: 0.9rem;
  word-break: break-word;
}
.comment-item strong { color: var(--clr-cyan); }
.comment-item small { font-size: 0.7rem; color: var(--clr-text-muted); margin-left: 10px; }
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: 2px solid var(--clr-cyan);
  color: var(--clr-cyan);
  padding: 12px 24px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 700;
  margin-top: 30px;
  transition: all 0.2s;
}
.back-link:hover { background: var(--clr-cyan); color: #fff; }
.auth-wall {
  max-width: 500px;
  margin: 100px auto;
  padding: 50px;
  text-align: center;
  background: var(--clr-navy-card);
  border-radius: var(--radius-lg);
  border: 2px solid var(--clr-cyan);
}
.auth-wall i { font-size: 4rem; color: var(--clr-cyan); margin-bottom: 20px; }
.auth-wall h2 { font-family: 'Poppins', sans-serif; margin-bottom: 12px; }
.auth-buttons { display: flex; gap: 16px; justify-content: center; margin-top: 24px; }
.signin-btn, .signup-btn {
  padding: 12px 28px;
  border-radius: 40px;
  font-weight: 700;
  cursor: pointer;
}
.signin-btn { background: transparent; border: 2px solid var(--clr-cyan); color: var(--clr-cyan); }
.signup-btn { background: var(--gradient-cyan); border: none; color: #fff; }
.loading-spinner { text-align: center; padding: 80px; }
@media (max-width: 768px) {
  .note-content { padding: 24px; }
  .main-nav { display: none; }
  .note-container { padding: 80px 0 40px; }
  .comment-input-group { gap: 8px; }
  .comment-submit { padding: 0 16px; font-size: 0.85rem; }
  .reaction-btn { padding: 5px 12px; font-size: 0.8rem; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-container">
    <a href="/" class="logo-link" id="logo-link">Aliver<span style="color:var(--clr-magenta);">Biopharm</span></a>
    <nav><ul class="main-nav" id="main-nav"></ul></nav>
  </div>
</header>

<main id="app-content"></main>

<footer class="footer-fat" id="footer"></footer>

<script>
const API_BASE = '/api/query';
let currentUser = null;
let currentNoteId = null;
let currentLevel = null;

const urlParams = new URLSearchParams(window.location.search);
const noteId = urlParams.get('id');
const level = urlParams.get('level') || 'O-Level';
const noteTitle = urlParams.get('title') || 'Study Note';
const returnTo = urlParams.get('return_to');
const returnSubtopic = urlParams.get('return_subtopic');
const returnTitle = urlParams.get('return_title');
currentLevel = level;

let backLinkUrl = '/';
if (returnTo && returnSubtopic) {
  if (returnTo === 'olevel') backLinkUrl = `/olevel.html?subtopic=${returnSubtopic}&title=${encodeURIComponent(returnTitle || '')}`;
  else if (returnTo === 'alevel') backLinkUrl = `/alevel.html?subtopic=${returnSubtopic}&title=${encodeURIComponent(returnTitle || '')}`;
  else if (returnTo === 'pharmacy') backLinkUrl = `/pharmacy.html?subtopic=${returnSubtopic}&title=${encodeURIComponent(returnTitle || '')}`;
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function apiCall(action, params) {
  const res = await fetch(API_BASE, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ action, ...params })
  });
  const json = await res.json();
  if (!res.ok) throw new Error(json.error);
  return json.data !== undefined ? json.data : json;
}

function showAuthWall() {
  const app = document.getElementById('app-content');
  app.innerHTML = `
    <div class="auth-wall">
      <i class="fa-solid fa-lock"></i>
      <h2>Sign In to Read Full Notes</h2>
      <p>Create a free account to access complete study notes, save your progress, and join our learning community.</p>
      <div class="auth-buttons">
        <button class="signin-btn" onclick="window.showAuthForm('signin')"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
        <button class="signup-btn" onclick="window.showAuthForm('signup')"><i class="fa-solid fa-user-plus"></i> Create Account</button>
      </div>
    </div>
  `;
}

function showContent() {
  const app = document.getElementById('app-content');
  app.innerHTML = `<div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;"></i><p>Loading note...</p></div>`;
  loadNote();
}

async function loadNote() {
  const app = document.getElementById('app-content');
  try {
    const note = await apiCall('get_note_content', { subtopic_id: noteId, level: currentLevel });
    
    document.title = `${note.title || noteTitle} | AliverBiopharm ${currentLevel} Notes`;
    
    const levelDisplay = { 'O-Level': 'O-LEVEL BIOLOGY', 'A-Level': 'A-LEVEL BIOLOGY', 'Pharmacy': 'PHARMACY' };
    const levelIcon = { 'O-Level': 'fa-leaf', 'A-Level': 'fa-dna', 'Pharmacy': 'fa-capsules' };
    const levelPath = { 'O-Level': 'olevel', 'A-Level': 'alevel', 'Pharmacy': 'pharmacy' };
    
     app.innerHTML = `
  <div class="note-container">
    <div class="note-header">
      <div class="level-badge"><i class="fa-solid ${levelIcon[currentLevel]}"></i> ${levelDisplay[currentLevel]}</div>
      <h1 class="note-title">${esc(note.title || noteTitle)}</h1>
    </div>
    <div class="note-content">
      ${note.content || '<p>No content available for this note.</p>'}
      <div class="reaction-bar" data-note-id="${noteId}">
        <button class="reaction-btn" data-reaction="like" onclick="toggleReaction('${noteId}', 'like')"><i class="fa-regular fa-thumbs-up"></i> <span class="reaction-count like-count">0</span></button>
        <button class="reaction-btn" data-reaction="love" onclick="toggleReaction('${noteId}', 'love')"><i class="fa-regular fa-heart"></i> <span class="reaction-count love-count">0</span></button>
        <button class="reaction-btn" data-reaction="helpful" onclick="toggleReaction('${noteId}', 'helpful')"><i class="fa-regular fa-lightbulb"></i> <span class="reaction-count helpful-count">0</span></button>
      </div>
      <div class="comment-section">
        <div class="comment-input-group">
          <input type="text" id="comment-input" placeholder="Add a comment or question...">
          <button class="comment-submit" onclick="submitComment()">Post</button>
        </div>
        <div class="comments-list" id="comments-list"></div>
      </div>
      <div style="margin-top:30px;">
        <a href="${backLinkUrl}" class="back-link" onclick="sessionStorage.setItem('fromNote', 'true')"><i class="fa-solid fa-arrow-left"></i> Back to ${currentLevel} Notes</a>
      </div>
    </div>
  </div>
`;
    await loadReactions();
    await loadComments();
  } catch (err) {
    app.innerHTML = `<div class="note-container"><div style="text-align:center; padding:60px;"><i class="fa-solid fa-exclamation-triangle" style="font-size:3rem; color:var(--clr-magenta);"></i><p style="margin-top:16px;">Failed to load note. Please try again.</p><a href="${backLinkUrl !== '/' ? backLinkUrl : '/'}" class="back-link" style="margin-top:20px; display:inline-block;">Back to Notes</a></div></div>`;
  }
}

async function loadReactions() {
  try {
    const data = await apiCall('get_note_reactions', { note_id: noteId });
    const likeSpan = document.querySelector('.like-count');
    const loveSpan = document.querySelector('.love-count');
    const helpfulSpan = document.querySelector('.helpful-count');
    if (likeSpan) likeSpan.textContent = data.counts?.like || 0;
    if (loveSpan) loveSpan.textContent = data.counts?.love || 0;
    if (helpfulSpan) helpfulSpan.textContent = data.counts?.helpful || 0;
    if (data.user_reaction) {
      const activeBtn = document.querySelector(`.reaction-btn[data-reaction="${data.user_reaction}"]`);
      if (activeBtn) activeBtn.classList.add('active');
    }
  } catch (err) { console.error('Failed to load reactions:', err); }
}

window.toggleReaction = async function(noteId, reactionType) {
  if (!currentUser) { alert('Please sign in to react.'); showAuthWall(); return; }
  try {
    await apiCall('toggle_note_reaction', { note_id: noteId, reaction_type: reactionType });
    await loadReactions();
  } catch (err) { console.error('Failed:', err); }
};

async function loadComments() {
  try {
    const interactions = await apiCall('get_resource_interactions', { resource_id: noteId });
    const commentList = document.getElementById('comments-list');
    if (commentList && interactions.comments) {
      if (interactions.comments.length === 0) {
        commentList.innerHTML = '<div style="text-align:center; padding:20px; color:var(--clr-text-muted);">No comments yet. Be the first to ask a question!</div>';
      } else {
        commentList.innerHTML = interactions.comments.map(c => `
          <div class="comment-item"><strong>${esc(c.user_name || 'User')}</strong> <small>${new Date(c.created_at).toLocaleDateString()}</small><br>${esc(c.comment)}</div>
        `).join('');
      }
    }
  } catch (err) { console.error('Failed to load comments:', err); }
}

window.submitComment = async function() {
  if (!currentUser) { alert('Please sign in to comment.'); showAuthWall(); return; }
  const input = document.getElementById('comment-input');
  const comment = input?.value.trim();
  if (!comment) return;
  try {
    await apiCall('comment_resource', { resource_id: noteId, comment: comment });
    if (input) input.value = '';
    await loadComments();
  } catch (err) { console.error('Failed to submit comment:', err); }
};

window.showAuthForm = function(mode) {
  const existing = document.getElementById('auth-modal');
  if (existing) existing.remove();
  const modal = document.createElement('div');
  modal.id = 'auth-modal';
  modal.style.cssText = 'position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);';
  modal.innerHTML = `
    <div style="background:var(--clr-navy-card);border:2px solid var(--clr-cyan);border-radius:20px;padding:2rem;max-width:380px;width:90%;position:relative;">
      <button id="close-auth" style="position:absolute;top:0.5rem;right:0.5rem;background:none;border:none;color:var(--clr-text-dim);cursor:pointer;">✕</button>
      <h3 style="color:var(--clr-cyan);margin-bottom:1.2rem;">${mode === 'signin' ? 'Sign In' : 'Create Account'}</h3>
      <form id="auth-form" style="display:flex;flex-direction:column;gap:1rem;">
        <input type="email" id="auth-email" style="padding:12px;border-radius:12px;border:1px solid var(--clr-border-glow);background:rgba(10,129,129,0.05);color:var(--clr-white);" placeholder="Email" required>
        <input type="password" id="auth-password" style="padding:12px;border-radius:12px;border:1px solid var(--clr-border-glow);background:rgba(10,129,129,0.05);color:var(--clr-white);" placeholder="Password" required>
        <button type="submit" style="background:var(--gradient-cyan);border:none;padding:12px;border-radius:40px;color:#fff;font-weight:700;cursor:pointer;">${mode === 'signin' ? 'Sign In' : 'Create Account'}</button>
      </form>
      <p style="text-align:center;margin-top:1rem;font-size:0.85rem;">${mode === 'signin' ? "No account? <a href='#' id='switch-mode' style='color:var(--clr-cyan);'>Sign up</a>" : "Have account? <a href='#' id='switch-mode' style='color:var(--clr-cyan);'>Sign in</a>"}</p>
      <p id="auth-error" style="color:#e74c3c;text-align:center;margin-top:0.5rem;display:none;"></p>
    </div>
  `;
  document.body.appendChild(modal);
  document.getElementById('close-auth').onclick = () => modal.remove();
  document.getElementById('switch-mode')?.addEventListener('click', (e) => {
    e.preventDefault(); modal.remove(); showAuthForm(mode === 'signin' ? 'signup' : 'signin');
  });
  document.getElementById('auth-form').onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    const errEl = document.getElementById('auth-error');
    errEl.style.display = 'none';
    try {
      const action = mode === 'signin' ? 'signin' : 'signup';
      const data = await apiCall(action, { email, password });
      if (data.user) {
        currentUser = data.user;
        modal.remove();
        showContent();
      } else if (mode === 'signup') {
        errEl.textContent = 'Check your email to confirm signup.';
        errEl.style.display = 'block';
      }
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  };
};

async function loadNavigationAndFooter() {
  try {
    const sections = await apiCall('get_all_site_sections');
    if (sections) {
      if (sections.site_config?.logo_url) {
        document.querySelectorAll('.logo-link').forEach(link => {
          link.innerHTML = `<img src="${esc(sections.site_config.logo_url)}" alt="AliverBiopharm" style="height:45px;width:auto;max-height:50px;">`;
        });
      }
      if (sections.navigation?.links) {
        const mainNav = document.getElementById('main-nav');
        if (mainNav) {
          mainNav.innerHTML = sections.navigation.links.map(link => `<li><a href="${esc(link.href)}">${esc(link.label)}</a></li>`).join('');
        }
      }
      if (sections.footer) {
        const fd = sections.footer;
        const footer = document.getElementById('footer');
        if (footer) {
          footer.innerHTML = `
            <div style="max-width:1200px; margin:0 auto; padding:40px 24px 24px; border-top:1px solid var(--clr-border-glow);">
              <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px; font-size:0.75rem; color:var(--clr-text-muted);">
                <p>&copy; ${new Date().getFullYear()} AliverBiopharm. All rights reserved.</p>
                <div style="display:flex;gap:24px;">
                  <a href="/privacy" style="color:var(--clr-text-dim); text-decoration:none;">Privacy Policy</a>
                  <a href="/terms" style="color:var(--clr-text-dim); text-decoration:none;">Terms of Use</a>
                </div>
              </div>
            </div>
          `;
        }
      }
    }
  } catch (err) { console.error('Failed to load:', err); }
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadNavigationAndFooter();
  try {
    const userData = await apiCall('get_user');
    if (userData?.user) {
      currentUser = userData.user;
      showContent();
    } else {
      showAuthWall();
    }
  } catch(e) {
    showAuthWall();
  }
});
</script>
</body>
</html>
