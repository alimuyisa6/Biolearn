 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title id="page-title">AliverBiopharm | Secure Study Notes</title>
<meta name="description" id="meta-description" content="Expert-written study notes for biology and pharmacy students.">
<meta name="robots" content="index, follow">
<link rel="canonical" id="canonical-url" href="https://aliverbiopharm.com/">
<meta property="og:title" id="og-title" content="AliverBiopharm Study Notes">
<meta property="og:description" id="og-description" content="Comprehensive study notes with interactive features.">
<meta name="theme-color" id="theme-color" content="#0a7e7e">
<link rel="icon" type="image/svg+xml" id="dynamic-favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --clr-deep-space: #eef7f7;
  --clr-cyan: #0a7e7e;
  --clr-magenta: #b8873a;
  --clr-navy-card: rgba(255, 255, 255, 0.85);
  --clr-navy-light: rgba(10, 129, 129, 0.08);
  --clr-white: #0d2e2e;
  --clr-text-dim: #2d5c5c;
  --clr-text-muted: #4a6f6f;
  --clr-border-glow: rgba(10, 129, 129, 0.15);
  --max-width: 1000px;
  --radius-lg: 1.4rem;
  --gradient-cyan: linear-gradient(135deg, #0a7e7e, #0a5f5f);
  --gradient-magenta: linear-gradient(135deg, #b8873a, #c28b2c);
}

body {
  background: var(--clr-deep-space);
  color: var(--clr-white);
  font-family: 'Inter', sans-serif;
  line-height: 1.7;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: rgba(238, 247, 247, 0.95);
  backdrop-filter: blur(22px);
  border-bottom: 3px solid var(--clr-magenta);
  height: 65px;
}

.header-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 65px;
}

.logo-link {
  font-size: 1.7rem;
  font-weight: 800;
  text-decoration: none;
  letter-spacing: -0.3px;
  line-height: 1.2;
  display: inline-flex;
  align-items: center;
  color: var(--clr-cyan);
}

.logo-link img {
  height: 42px;
  width: auto;
  max-height: 50px;
  object-fit: contain;
}

.main-nav {
  display: flex;
  gap: 32px;
  list-style: none;
}

.main-nav a {
  color: var(--clr-text-dim);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.2s;
}

.main-nav a:hover {
  color: var(--clr-magenta);
}

.progress-fixed-container {
  position: fixed;
  top: 65px;
  left: 0;
  right: 0;
  z-index: 99;
  background: var(--clr-deep-space);
  padding: 8px 24px 0 24px;
}

.progress-wrapper {
  max-width: var(--max-width);
  margin: 0 auto;
  width: 100%;
}

.progress-container {
  width: 100%;
  height: 14px;
  background: var(--clr-border-glow);
  border-radius: 20px;
  border: 2px solid var(--clr-magenta);
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--clr-magenta), var(--clr-cyan), #e67e22, var(--clr-magenta));
  background-size: 300% 100%;
  border-radius: 20px;
  animation: waveMove 2s ease infinite;
  transition: width 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}

@keyframes waveMove {
  0% { background-position: 0% 0%; }
  50% { background-position: 100% 0%; }
  100% { background-position: 0% 0%; }
}

.progress-percentage {
  text-align: right;
  font-size: 0.7rem;
  font-family: monospace;
  font-weight: 600;
  color: var(--clr-magenta);
  margin-top: 6px;
}

.resume-prompt {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: var(--gradient-magenta);
  color: #fff;
  padding: 12px 20px;
  border-radius: 50px;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  z-index: 100;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideIn 0.3s ease;
}

.resume-prompt:hover {
  transform: translateY(-2px);
}

@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

.note-container {
  max-width: var(--max-width);
  margin: 110px auto 0 auto;
  padding: 0 24px 60px;
  width: 100%;
  flex: 1;
}

.note-header {
  margin-bottom: 40px;
  text-align: center;
}

.note-meta-bar {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 16px 0 8px;
  flex-wrap: wrap;
}

.note-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--clr-text-muted);
  background: rgba(10, 129, 129, 0.08);
  padding: 4px 12px;
  border-radius: 30px;
}

.text-controls {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  margin-bottom: 16px;
}

.text-size-btn {
  background: none;
  border: 1px solid var(--clr-border-glow);
  border-radius: 30px;
  padding: 4px 12px;
  font-size: 0.7rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--clr-text-dim);
  transition: all 0.2s;
}

.text-size-btn:hover {
  border-color: var(--clr-cyan);
  color: var(--clr-cyan);
}

.note-content-wrapper {
  transition: font-size 0.2s ease;
}

.note-content-wrapper.small { font-size: 0.85rem; }
.note-content-wrapper.medium { font-size: 1rem; }
.note-content-wrapper.large { font-size: 1.15rem; }

.badge-completed {
  background: linear-gradient(135deg, #27ae60, #2ecc71);
  color: #fff;
  padding: 6px 16px;
  border-radius: 40px;
  font-size: 0.7rem;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  animation: fadeInUp 0.4s ease;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.breadcrumbs {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 0.75rem;
  color: var(--clr-text-muted);
  margin-top: 8px;
  flex-wrap: wrap;
}

.breadcrumbs a {
  color: var(--clr-cyan);
  text-decoration: none;
}

.breadcrumbs a:hover {
  text-decoration: underline;
  color: var(--clr-magenta);
}

.level-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--gradient-magenta);
  color: #fff;
  padding: 6px 20px;
  border-radius: 40px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 24px;
}

.note-title {
  font-family: 'Poppins', sans-serif;
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 800;
  margin-bottom: 8px;
}

.note-content {
  background: var(--clr-navy-card);
  border-radius: 24px;
  padding: 48px;
  border: 1px solid var(--clr-border-glow);
  overflow-x: auto;
}

.note-content h1, .note-content h2, .note-content h3 {
  font-family: 'Poppins', sans-serif;
  margin: 32px 0 16px;
}

.note-content h1 { font-size: 1.8rem; }
.note-content h2 { font-size: 1.4rem; color: var(--clr-cyan); }
.note-content h3 { font-size: 1.2rem; color: var(--clr-magenta); }
.note-content p { margin-bottom: 20px; color: var(--clr-text-dim); line-height: 1.8; }
.note-content ul, .note-content ol { margin: 16px 0 16px 32px; }

.table-of-contents {
  background: var(--clr-navy-light);
  border-radius: 16px;
  padding: 20px 24px;
  margin: 0 0 30px 0;
  border-left: 4px solid var(--clr-magenta);
}

.table-of-contents h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1rem;
  margin: 0 0 12px 0;
  color: var(--clr-magenta);
}

.table-of-contents ul { list-style: none; margin: 0; }
.table-of-contents li { margin: 8px 0; }
.table-of-contents a {
  color: var(--clr-text-dim);
  text-decoration: none;
  font-size: 0.85rem;
}

.table-of-contents a:hover {
  color: var(--clr-magenta);
  padding-left: 5px;
}

.key-points {
  background: rgba(184, 135, 58, 0.08);
  border-left: 4px solid var(--clr-magenta);
  padding: 20px 24px;
  margin: 30px 0;
  border-radius: 12px;
}

.key-points h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1rem;
  margin: 0 0 12px 0;
  color: var(--clr-magenta);
}

.key-points ul { margin: 0 0 0 20px; }
.key-points li { margin: 8px 0; color: var(--clr-text-dim); }

.toolbar {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.tool-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1px solid var(--clr-border-glow);
  border-radius: 40px;
  padding: 6px 14px;
  font-size: 0.75rem;
  cursor: pointer;
  color: var(--clr-text-dim);
  transition: all 0.2s;
}

.tool-btn:hover {
  border-color: var(--clr-cyan);
  color: var(--clr-cyan);
}

.reaction-bar {
  display: flex;
  gap: 12px;
  margin: 32px 0 24px;
  flex-wrap: wrap;
}

.reaction-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1.5px solid var(--clr-border-glow);
  border-radius: 40px;
  padding: 6px 16px;
  font-weight: 500;
  font-size: 0.85rem;
  cursor: pointer;
  color: var(--clr-text-dim);
  transition: all 0.2s;
}

.reaction-btn.active {
  background: var(--gradient-cyan);
  border-color: transparent;
  color: #fff;
}

.comment-section {
  margin-top: 20px;
  width: 100%;
}

.comment-input-group {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.comment-input-group input {
  flex: 1;
  min-width: 200px;
  padding: 10px 18px;
  border-radius: 50px;
  border: 1px solid var(--clr-border-glow);
  background: var(--clr-navy-card);
  color: var(--clr-white);
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
}

.comment-submit {
  background: var(--gradient-cyan);
  border: none;
  padding: 0 24px;
  border-radius: 50px;
  color: #fff;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  white-space: nowrap;
}

.comments-list {
  max-height: 300px;
  overflow-y: auto;
}

.comment-item {
  padding: 12px 0;
  border-bottom: 1px solid var(--clr-border-glow);
  font-size: 0.9rem;
  word-break: break-word;
}

.comment-item strong {
  color: var(--clr-cyan);
}

.comment-item small {
  font-size: 0.7rem;
  color: var(--clr-text-muted);
  margin-left: 10px;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: 2px solid var(--clr-cyan);
  color: var(--clr-cyan);
  padding: 12px 24px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 700;
  margin-top: 30px;
  transition: all 0.2s;
}

.back-link:hover {
  background: var(--clr-cyan);
  color: #fff;
}

.loading-spinner-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 400px;
  width: 100%;
  flex: 1;
}

.loading-spinner {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.spinner-svg {
  width: 60px;
  height: 60px;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.footer {
  background: transparent;
  border-top: 1px solid var(--clr-border-glow);
  margin-top: auto;
}

.footer-content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 24px 24px;
}

.footer-inner {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  font-size: 0.75rem;
  color: var(--clr-text-muted);
}

.footer-inner a {
  color: var(--clr-text-muted);
  text-decoration: none;
}

.footer-inner a:hover {
  color: var(--clr-magenta);
}

@media (max-width: 768px) {
  .note-content { padding: 24px; }
  .main-nav { display: none; }
  .note-container { padding: 0 16px 40px; }
  .comment-input-group { flex-direction: column; }
  .comment-submit { padding: 10px 24px; }
  .resume-prompt { bottom: 20px; right: 20px; padding: 8px 16px; font-size: 0.75rem; }
  .toolbar { justify-content: center; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-container">
    <a href="/" class="logo-link" id="logo-link">Aliver<span style="color:var(--clr-magenta);">Biopharm</span></a>
    <nav><ul class="main-nav" id="main-nav"></ul></nav>
  </div>
</header>
<div class="progress-fixed-container">
  <div class="progress-wrapper">
    <div class="progress-container"><div class="progress-bar-fill" id="progress-bar-fill"></div></div>
    <div class="progress-percentage" id="progress-percentage">0% read</div>
  </div>
</div>
<main id="app-content" style="flex:1; display:flex; flex-direction:column;"></main>
<footer class="footer" id="footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
<script>
(function(){
  const ALLOWED_LEVELS = ['O-Level', 'A-Level', 'Pharmacy'];
  const ALLOWED_RETURN = ['olevel', 'alevel', 'pharmacy'];
  const API_BASE = '/api/query';
  let currentUser = null;
  let currentLevel = 'O-Level';
  let maxScrollPercentage = 0;
  let saveTimer = null;
  let currentUtterance = null;
  let completionBadgeShown = false;
  let activeFetchController = null;
  let noteId = null;

  function safeUrl(url) {
    try {
      if(!url || typeof url !== 'string') return '/';
      if(url.startsWith('/')) return url;
      if(url.startsWith('https://aliverbiopharm.com')) return url;
      return '/';
    } catch(e) { return '/'; }
  }

  function isSafeHref(url) {
    if(!url || typeof url !== 'string') return false;
    const lower = url.toLowerCase();
    const blocked = ['javascript:', 'vbscript:', 'data:'];
    return !blocked.some(proto => lower.startsWith(proto));
  }

  function esc(str) {
    if(!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function validateId(id) {
    if(!id || typeof id !== 'string') return false;
    return /^[a-zA-Z0-9_-]+$/.test(id);
  }

  function redirectToHomepage() { window.location.href = '/'; }

  function getScrollPercent() {
    const winScroll = window.scrollY || document.documentElement.scrollTop || 0;
    const height = document.documentElement.scrollHeight - window.innerHeight;
    if(height <= 0) return 0;
    return Math.min(100, Math.max(0, (winScroll / height) * 100));
  }

  function updateProgressBar(percentage) {
    const fill = document.getElementById('progress-bar-fill');
    const text = document.getElementById('progress-percentage');
    if(fill) fill.style.width = percentage + '%';
    if(text) text.innerText = Math.floor(percentage) + '% read';
    if(!completionBadgeShown && percentage >= 95) {
      completionBadgeShown = true;
      const badgeContainer = document.getElementById('completion-badge-container');
      if(badgeContainer && !badgeContainer.querySelector('.badge-completed')) {
        badgeContainer.innerHTML = '<div class="badge-completed"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Completed! You mastered this note.</div>';
      }
    }
  }

  function saveProgressToLocal() {
    try {
      if(maxScrollPercentage >= 10 && noteId) {
        localStorage.setItem('progress_' + noteId, maxScrollPercentage);
        localStorage.setItem('progress_' + noteId + '_time', Date.now());
      }
    } catch(e) {}
  }

  function loadProgressFromLocal() {
    try {
      const saved = localStorage.getItem('progress_' + noteId);
      if(saved) {
        let percentage = parseFloat(saved);
        percentage = Math.min(100, Math.max(0, percentage));
        if(percentage > 10 && percentage < 95) {
          maxScrollPercentage = percentage;
          updateProgressBar(maxScrollPercentage);
          showResumePrompt(percentage);
        } else if(percentage >= 95) {
          maxScrollPercentage = percentage;
          updateProgressBar(maxScrollPercentage);
        }
        return percentage;
      }
    } catch(e) {}
    return 0;
  }

  function handleScroll() {
    let currentPercent = getScrollPercent();
    if(currentPercent > maxScrollPercentage) {
      maxScrollPercentage = currentPercent;
      updateProgressBar(maxScrollPercentage);
      if(saveTimer) clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveProgressToLocal(), 1000);
    }
  }

  function showResumePrompt(savedPercentage) {
    if(!savedPercentage || savedPercentage <= 10 || savedPercentage >= 95) return;
    const existing = document.querySelector('.resume-prompt');
    if(existing) existing.remove();
    const prompt = document.createElement('div');
    prompt.className = 'resume-prompt';
    prompt.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Resume from ${Math.floor(savedPercentage)}%`;
    prompt.onclick = () => {
      const height = document.documentElement.scrollHeight - window.innerHeight;
      window.scrollTo({ top: (savedPercentage / 100) * height, behavior: 'smooth' });
      prompt.remove();
    };
    document.body.appendChild(prompt);
    setTimeout(() => prompt.remove(), 8000);
  }

  async function apiCall(action, params, csrfToken = null) {
    if(activeFetchController) activeFetchController.abort();
    const controller = new AbortController();
    activeFetchController = controller;
    const timeout = setTimeout(() => controller.abort(), 10000);
    try {
      const headers = { 'Content-Type': 'application/json' };
      if(csrfToken) headers['X-CSRF-Token'] = csrfToken;
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: headers,
        credentials: 'include',
        body: JSON.stringify({ action, ...params }),
        signal: controller.signal
      });
      clearTimeout(timeout);
      const json = await res.json();
      if(!res.ok) throw new Error(json.error || 'Request failed');
      return json.data !== undefined ? json.data : json;
    } catch(e) {
      if(e.name === 'AbortError') console.warn('Request aborted');
      else console.error('API call failed:', e);
      return null;
    } finally {
      activeFetchController = null;
    }
  }

  function toggleTextSize(size) {
    const wrapper = document.querySelector('.note-content-wrapper');
    if(wrapper) {
      wrapper.classList.remove('small', 'medium', 'large');
      wrapper.classList.add(size);
      try { localStorage.setItem('note_text_size', size); } catch(e) {}
    }
  }

  function speakNote() {
    if(currentUtterance) window.speechSynthesis.cancel();
    const textElem = document.querySelector('.note-content-wrapper');
    if(!textElem) return;
    const rawText = textElem.innerText;
    if(!rawText) return;
    currentUtterance = new SpeechSynthesisUtterance(rawText);
    currentUtterance.rate = 0.9;
    currentUtterance.onend = () => { currentUtterance = null; };
    window.speechSynthesis.speak(currentUtterance);
  }

  function stopSpeech() { if(currentUtterance) { window.speechSynthesis.cancel(); currentUtterance = null; } }

  function printNote() {
    const content = document.querySelector('.note-content-wrapper');
    if(!content) return;
    const title = document.querySelector('.note-title')?.innerText || 'Study Note';
    const printWindow = window.open('', '_blank');
    printWindow.document.write(`<html><head><title>${esc(title)}</title><style>body{font-family:'Inter',sans-serif;padding:40px;max-width:900px;margin:0 auto;line-height:1.6;}h1{color:#0a7e7e;}h2{color:#b8873a;}</style></head><body><h1>${esc(title)}</h1>${content.innerHTML}</body></html>`);
    printWindow.document.close();
    printWindow.print();
  }

  function safeSanitize(html) {
    if(!html) return '';
    return DOMPurify.sanitize(html, { USE_PROFILES: { html: true }, ALLOWED_TAGS: ['h1','h2','h3','h4','p','ul','ol','li','strong','em','a','div','span','br','hr','table','thead','tbody','tr','th','td','blockquote','code','pre'], ALLOWED_ATTR: ['href','target','id','class','style'] });
  }

  window.toggleTextSize = toggleTextSize;
  window.speakNote = speakNote;
  window.stopSpeech = stopSpeech;
  window.printNote = printNote;

  window.toggleReaction = async function(nid, type) {
    if(!currentUser) { redirectToHomepage(); return; }
    try { await apiCall('toggle_note_reaction', { note_id: nid, reaction_type: type }); await loadReactions(); } catch(e) {}
  };

  window.submitComment = async function() {
    if(!currentUser) { redirectToHomepage(); return; }
    const input = document.getElementById('comment-input');
    let comment = input?.value.trim() || '';
    if(comment.length < 2 || comment.length > 500) { alert('Comment must be 2-500 characters.'); return; }
    const sanitizedComment = comment.replace(/[<>]/g, '');
    try { await apiCall('comment_resource', { resource_id: noteId, comment: sanitizedComment }); if(input) input.value = ''; await loadComments(); } catch(e) {}
  };

  async function loadReactions() {
    try {
      const data = await apiCall('get_note_reactions', { note_id: noteId });
      if(data) {
        const likeSpan = document.querySelector('.like-count');
        const loveSpan = document.querySelector('.love-count');
        const helpfulSpan = document.querySelector('.helpful-count');
        if(likeSpan) likeSpan.textContent = data.counts?.like || 0;
        if(loveSpan) loveSpan.textContent = data.counts?.love || 0;
        if(helpfulSpan) helpfulSpan.textContent = data.counts?.helpful || 0;
        if(data.user_reaction) document.querySelector(`.reaction-btn[data-reaction="${data.user_reaction}"]`)?.classList.add('active');
      }
    } catch(e) {}
  }

  async function loadComments() {
    try {
      const interactions = await apiCall('get_resource_interactions', { resource_id: noteId });
      const list = document.getElementById('comments-list');
      if(list && interactions?.comments) {
        if(!interactions.comments.length) list.innerHTML = '<div style="text-align:center;padding:20px;">No comments yet.</div>';
        else list.innerHTML = interactions.comments.map(c => `<div class="comment-item"><strong>${esc(c.user_name)}</strong> <small>${new Date(c.created_at).toLocaleDateString()}</small><br>${esc(c.comment)}</div>`).join('');
      }
    } catch(e) {}
  }

  function updateFavicon() {
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#0a7e7e"/><text x="50" y="68" font-size="48" text-anchor="middle" fill="#b8873a" font-weight="bold">AB</text></svg>';
    const dataUrl = "data:image/svg+xml," + encodeURIComponent(svg);
    let link = document.getElementById('dynamic-favicon');
    if(!link) { link = document.createElement('link'); link.rel = 'icon'; link.type = 'image/svg+xml'; link.id = 'dynamic-favicon'; document.head.appendChild(link); }
    link.href = dataUrl;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const rawNoteId = urlParams.get('id');
  const rawLevel = urlParams.get('level');
  const rawReturnTo = urlParams.get('return_to');
  const rawReturnSubtopic = urlParams.get('return_subtopic');
  const rawReturnTitle = urlParams.get('return_title');

  if(!validateId(rawNoteId)) redirectToHomepage();
  noteId = rawNoteId;
  if(!ALLOWED_LEVELS.includes(rawLevel)) redirectToHomepage();
  currentLevel = rawLevel;

  let backLinkUrl = '/';
  if(rawReturnTo && ALLOWED_RETURN.includes(rawReturnTo) && rawReturnSubtopic && validateId(rawReturnSubtopic)) {
    const safeSubtopic = encodeURIComponent(rawReturnSubtopic);
    const safeTitle = rawReturnTitle ? encodeURIComponent(rawReturnTitle) : '';
    if(rawReturnTo === 'olevel') backLinkUrl = `/olevel.html?subtopic=${safeSubtopic}&title=${safeTitle}`;
    else if(rawReturnTo === 'alevel') backLinkUrl = `/alevel.html?subtopic=${safeSubtopic}&title=${safeTitle}`;
    else if(rawReturnTo === 'pharmacy') backLinkUrl = `/pharmacy.html?subtopic=${safeSubtopic}&title=${safeTitle}`;
  }

  async function loadNote() {
    const app = document.getElementById('app-content');
    app.innerHTML = `<div class="loading-spinner-container"><div class="loading-spinner"><svg class="spinner-svg" viewBox="0 0 24 24" fill="none" stroke="var(--clr-cyan)" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg><p>Loading note...</p></div></div>`;
    try {
      const note = await apiCall('get_note_content', { subtopic_id: noteId, level: currentLevel });
      if(!note) throw new Error('Note not found');
      document.title = (note.title || 'Study Note') + ' | AliverBiopharm ' + currentLevel + ' Notes';
      updateFavicon();

      const levelDisplay = { 'O-Level': 'O-LEVEL BIOLOGY', 'A-Level': 'A-LEVEL BIOLOGY', 'Pharmacy': 'PHARMACY' };
      const levelIcon = { 
        'O-Level': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
        'A-Level': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M20 12L12 20M12 4L4 12M12 4v16M4 12h16"/><circle cx="12" cy="12" r="3"/></svg>',
        'Pharmacy': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="12" y1="6" x2="12" y2="14"/><line x1="8" y1="10" x2="16" y2="10"/></svg>'
      };

      const readTime = (() => { const words = (note.content || '').replace(/<[^>]*>/g, '').trim().split(/\s+/).length; return `${Math.max(2, Math.ceil(words / 200))} min read`; })();
      const lastUpdated = note.updated_at ? new Date(note.updated_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : new Date().toLocaleDateString();
      const levelPath = currentLevel === 'Pharmacy' ? 'pharmacy.html' : (currentLevel === 'A-Level' ? 'alevel.html' : 'olevel.html');
      
      let rawContent = note.content || '<p>No content available.</p>';
      const sanitizedFullContent = safeSanitize(rawContent);
      
      const toc = (() => {
        const matches = sanitizedFullContent.match(/<h2[^>]*>.*?<\/h2>/gi);
        if(!matches || matches.length < 2) return '';
        let html = '<div class="table-of-contents"><h3><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--clr-magenta)" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> Contents</h3><ul>';
        matches.forEach((heading, idx) => { const title = heading.replace(/<[^>]*>/g, ''); html += `<li><a href="#section-${idx}">${esc(title)}</a></li>`; });
        html += '</ul></div>';
        return html;
      })();
      
      let contentWithIds = sanitizedFullContent.replace(/<h2>/gi, (match, offset) => { 
        const idx = (sanitizedFullContent.slice(0, offset).match(/<h2>/gi) || []).length; 
        return `<h2 id="section-${idx}">`; 
      });
      
      const keyPoints = (() => {
        const strongMatches = contentWithIds.match(/<strong>([^<]+)<\/strong>/g);
        if(strongMatches && strongMatches.length >= 3) {
          let points = '';
          for(let i = 0; i < Math.min(6, strongMatches.length); i++) {
            const term = strongMatches[i].replace(/<[^>]*>/g, '');
            if(term.length > 3 && term.length < 60) points += `<li>${esc(term)}</li>`;
          }
          if(points) return `<div class="key-points"><h3><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--clr-magenta)" stroke-width="2"><path d="M9.5 2.5L12 5l2.5-2.5a4.5 4.5 0 0 1 5.5 5.5L12 19 4 8a4.5 4.5 0 0 1 5.5-5.5z"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg> Key Terms to Remember</h3><ul>${points}</ul></div>`;
        }
        return '';
      })();
      
      const savedTextSize = (() => { try { return localStorage.getItem('note_text_size') || 'medium'; } catch(e){ return 'medium'; } })();
      maxScrollPercentage = 0;
      completionBadgeShown = false;
      updateProgressBar(0);
      
      app.innerHTML = `<div class="note-container"><div class="note-header"><div class="level-badge">${levelIcon[currentLevel]} ${levelDisplay[currentLevel]}</div><h1 class="note-title">${esc(note.title)}</h1><div class="note-meta-bar"><span class="note-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ${readTime}</span><span class="note-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Updated ${lastUpdated}</span></div><div class="breadcrumbs"><a href="/">Home</a><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg><a href="/${levelPath}">${currentLevel}</a><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg><span>${esc(note.title)}</span></div><div id="completion-badge-container"></div></div><div class="toolbar"><div class="text-controls"><button class="text-size-btn" onclick="toggleTextSize('small')">A-</button><button class="text-size-btn" onclick="toggleTextSize('medium')">A</button><button class="text-size-btn" onclick="toggleTextSize('large')">A+</button></div><button class="tool-btn" onclick="speakNote()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg> Listen</button><button class="tool-btn" onclick="stopSpeech()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"/></svg> Stop</button><button class="tool-btn" onclick="printNote()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V3h12v6"/><rect x="4" y="12" width="16" height="10"/><path d="M18 12h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h2"/><path d="M8 12h8"/></svg> Print/PDF</button><button class="tool-btn" id="copy-link-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy Link</button><button class="tool-btn" id="share-note-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Share</button></div><div class="note-content-wrapper ${savedTextSize}"><div class="note-content">${toc}${contentWithIds}${keyPoints}<div class="reaction-bar" data-note-id="${noteId}"><button class="reaction-btn" data-reaction="like" onclick="toggleReaction('${noteId}', 'like')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--clr-cyan)" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg> <span class="reaction-count like-count">0</span></button><button class="reaction-btn" data-reaction="love" onclick="toggleReaction('${noteId}', 'love')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--clr-cyan)" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> <span class="reaction-count love-count">0</span></button><button class="reaction-btn" data-reaction="helpful" onclick="toggleReaction('${noteId}', 'helpful')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--clr-cyan)" stroke-width="2"><path d="M9.5 2.5L12 5l2.5-2.5a4.5 4.5 0 0 1 5.5 5.5L12 19 4 8a4.5 4.5 0 0 1 5.5-5.5z"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg> <span class="reaction-count helpful-count">0</span></button></div><div class="comment-section"><div class="comment-input-group"><input type="text" id="comment-input" placeholder="Add a comment or question..." maxlength="500"><button class="comment-submit" onclick="submitComment()">Post</button></div><div class="comments-list" id="comments-list"></div></div><div style="margin-top:30px;"><a href="${safeUrl(backLinkUrl)}" class="back-link" onclick="sessionStorage.setItem('fromNote', 'true')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--clr-cyan)" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back to ${currentLevel} Notes</a></div></div></div></div>`;
      
      document.getElementById('copy-link-btn')?.addEventListener('click', () => { navigator.clipboard.writeText(window.location.href); alert('Link copied!'); });
      document.getElementById('share-note-btn')?.addEventListener('click', () => { if(navigator.share) navigator.share({ title: document.title, url: window.location.href }); else navigator.clipboard.writeText(window.location.href).then(() => alert('Link copied!')); });
      
      await loadReactions();
      await loadComments();
      loadProgressFromLocal();
      window.removeEventListener('scroll', handleScroll);
      window.addEventListener('scroll', handleScroll);
      window.addEventListener('beforeunload', () => saveProgressToLocal());
    } catch(err) {
      console.error(err);
      app.innerHTML = `<div class="note-container"><div style="text-align:center;padding:80px;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--clr-magenta)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="var(--clr-magenta)" stroke="none"/></svg><p>Failed to load note. Please try again.</p><a href="${safeUrl(backLinkUrl)}" class="back-link">Back</a></div></div>`;
    }
  }

  async function loadNavigationAndFooter() {
    try {
      const sections = await apiCall('get_all_site_sections');
      if(sections?.site_config?.logo_url) {
        const safeLogo = safeUrl(sections.site_config.logo_url);
        const logoLink = document.getElementById('logo-link');
        if(logoLink && safeLogo && isSafeHref(safeLogo)) {
          logoLink.innerHTML = `<img src="${esc(safeLogo)}" alt="AliverBiopharm" style="height:42px;width:auto;max-height:50px;">`;
        }
      }
      if(sections?.navigation?.links) {
        const navHtml = sections.navigation.links.map(l => { 
          const href = safeUrl(l.href); 
          return isSafeHref(href) ? `<li><a href="${esc(href)}">${esc(l.label)}</a></li>` : ''; 
        }).join('');
        const navContainer = document.getElementById('main-nav');
        if(navContainer) navContainer.innerHTML = navHtml;
      }
      const footerEl = document.getElementById('footer');
      if(footerEl) {
        footerEl.innerHTML = `<div class="footer-content"><div class="footer-inner"><p>&copy; ${new Date().getFullYear()} AliverBiopharm. All rights reserved.</p><div style="display:flex;gap:24px;"><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div></div></div>`;
      }
    } catch(e) {
      console.error('Failed to load navigation:', e);
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    await loadNavigationAndFooter();
    try {
      const userData = await apiCall('get_user');
      if(userData?.user) { 
        currentUser = userData.user; 
        loadNote(); 
      } else {
        redirectToHomepage();
      }
    } catch(e) { 
      redirectToHomepage(); 
    }
  });
})();
</script>
</body>
</html>
