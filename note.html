 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title id="page-title">Loading Note... | AliverBiopharm</title>
<meta name="description" id="meta-description" content="Expert-written study notes for biology and pharmacy students.">
<meta name="robots" content="index, follow">
<link rel="canonical" id="canonical-url" href="https://aliverbiopharm.com/">
<meta property="og:title" id="og-title" content="AliverBiopharm Study Notes">
<meta property="og:description" id="og-description" content="Comprehensive study notes with interactive features.">
<meta name="theme-color" id="theme-color" content="#0a7e7e">
<link rel="icon" type="image/svg+xml" id="dynamic-favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --clr-deep-space: #eef7f7;
  --clr-cyan: #0a7e7e;
  --clr-magenta: #b8873a;
  --clr-navy-card: rgba(255, 255, 255, 0.85);
  --clr-navy-light: rgba(10, 129, 129, 0.08);
  --clr-white: #0d2e2e;
  --clr-text-dim: #2d5c5c;
  --clr-text-muted: #4a6f6f;
  --clr-border-glow: rgba(10, 129, 129, 0.15);
  --max-width: 1000px;
  --radius-lg: 1.4rem;
  --gradient-cyan: linear-gradient(135deg, #0a7e7e, #0a5f5f);
  --gradient-magenta: linear-gradient(135deg, #b8873a, #c28b2c);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--clr-deep-space);
  color: var(--clr-white);
  font-family: 'Inter', sans-serif;
  line-height: 1.7;
}
.site-header {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 100;
  background: rgba(238, 247, 247, 0.92);
  backdrop-filter: blur(22px);
  border-bottom: 3px solid var(--clr-magenta);
  height: 65px;
}
.header-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 65px;
}
.logo-link {
  font-size: 1.7rem;
  font-weight: 800;
  text-decoration: none;
  letter-spacing: -0.3px;
  line-height: 1.2;
  display: inline-block;
  max-width: 100%;
  white-space: nowrap;
}
.logo-link img { 
  height: 45px; 
  width: auto;
  max-height: 50px;
  object-fit: contain;
}
.main-nav { display: flex; gap: 32px; list-style: none; }
.main-nav a {
  color: var(--clr-text-dim);
  text-decoration: none;
  font-weight: 500;
  transition: color 0.2s;
}
.main-nav a:hover { color: var(--clr-magenta); }

svg { flex-shrink: 0; vertical-align: middle; }

.progress-fixed-container {
  position: fixed;
  top: 65px;
  left: 0;
  right: 0;
  z-index: 99;
  background: var(--clr-deep-space);
  padding: 8px 24px 0 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.progress-wrapper {
  max-width: var(--max-width);
  margin: 0 auto;
  width: 100%;
}
.progress-container {
  width: 100%;
  height: 14px;
  background: var(--clr-border-glow);
  border-radius: 20px;
  border: 2px solid var(--clr-magenta);
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--clr-magenta), var(--clr-cyan), #e67e22, var(--clr-magenta));
  background-size: 300% 100%;
  border-radius: 20px;
  animation: waveMove 2s ease infinite;
  transition: width 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}
@keyframes waveMove {
  0% { background-position: 0% 0%; }
  50% { background-position: 100% 0%; }
  100% { background-position: 0% 0%; }
}
.progress-percentage {
  text-align: right;
  font-size: 0.7rem;
  font-family: 'DM Mono', monospace;
  font-weight: 600;
  color: var(--clr-magenta);
  margin-top: 6px;
  letter-spacing: 0.5px;
}
.resume-prompt {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: var(--gradient-magenta);
  color: #fff;
  padding: 12px 20px;
  border-radius: 50px;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  z-index: 100;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideIn 0.3s ease;
}
.resume-prompt:hover { transform: translateY(-2px); }
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}
.note-container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 110px 24px 60px;
}
.note-header { margin-bottom: 40px; text-align: center; }
.note-meta-bar {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin: 16px 0 8px;
  flex-wrap: wrap;
}
.note-meta-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--clr-text-muted);
  background: rgba(10, 129, 129, 0.08);
  padding: 4px 12px;
  border-radius: 30px;
}
.breadcrumbs {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 0.75rem;
  color: var(--clr-text-muted);
  margin-top: 8px;
  flex-wrap: wrap;
}
.breadcrumbs a {
  color: var(--clr-cyan);
  text-decoration: none;
  transition: color 0.2s;
}
.breadcrumbs a:hover {
  text-decoration: underline;
  color: var(--clr-magenta);
}
.breadcrumbs svg {
  opacity: 0.5;
}
.level-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--gradient-magenta);
  color: #fff;
  padding: 6px 20px;
  border-radius: 40px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 24px;
}
.level-badge svg { margin-right: 2px; }
.note-title {
  font-family: 'Poppins', sans-serif;
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 800;
  margin-bottom: 8px;
}
.note-content {
  background: var(--clr-navy-card);
  border-radius: 24px;
  padding: 48px;
  border: 1px solid var(--clr-border-glow);
  font-size: 0.95rem;
  line-height: 1.7;
}
.note-content h1, .note-content h2, .note-content h3 {
  font-family: 'Poppins', sans-serif;
  margin: 32px 0 16px;
}
.note-content h1 { font-size: 1.8rem; }
.note-content h2 { font-size: 1.4rem; color: var(--clr-cyan); }
.note-content h3 { font-size: 1.2rem; color: var(--clr-magenta); }
.note-content p { margin-bottom: 20px; color: var(--clr-text-dim); line-height: 1.8; }
.note-content ul, .note-content ol { margin: 16px 0 16px 32px; }
.table-of-contents {
  background: var(--clr-navy-light);
  border-radius: 16px;
  padding: 20px 24px;
  margin: 0 0 30px 0;
  border-left: 4px solid var(--clr-magenta);
}
.table-of-contents h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1rem;
  margin: 0 0 12px 0;
  color: var(--clr-magenta);
}
.table-of-contents ul { list-style: none; margin: 0; }
.table-of-contents li { margin: 8px 0; }
.table-of-contents a {
  color: var(--clr-text-dim);
  text-decoration: none;
  font-size: 0.85rem;
  transition: color 0.2s;
}
.table-of-contents a:hover { color: var(--clr-magenta); padding-left: 5px; }
.key-points {
  background: rgba(184, 135, 58, 0.08);
  border-left: 4px solid var(--clr-magenta);
  padding: 20px 24px;
  margin: 30px 0;
  border-radius: 12px;
}
.key-points h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 1rem;
  margin: 0 0 12px 0;
  color: var(--clr-magenta);
}
.key-points ul { margin: 0 0 0 20px; }
.key-points li { margin: 8px 0; color: var(--clr-text-dim); }
.share-actions {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-bottom: 20px;
}
.share-action {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1px solid var(--clr-border-glow);
  border-radius: 40px;
  padding: 6px 14px;
  font-size: 0.75rem;
  cursor: pointer;
  color: var(--clr-text-dim);
  transition: all 0.2s;
}
.share-action:hover { border-color: var(--clr-cyan); color: var(--clr-cyan); }
.share-action svg { margin-right: 2px; }
.related-notes {
  margin: 40px 0 20px;
  padding-top: 30px;
  border-top: 2px solid var(--clr-border-glow);
}
.related-notes h3 {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--clr-cyan);
  font-size: 1.1rem;
  margin-bottom: 16px;
}
.related-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}
.related-card {
  background: var(--clr-navy-light);
  padding: 16px;
  border-radius: 12px;
  text-decoration: none;
  transition: all 0.2s;
  border: 1px solid transparent;
}
.related-card:hover { border-color: var(--clr-magenta); transform: translateY(-3px); }
.related-card strong { color: var(--clr-white); font-size: 0.9rem; }
.related-card p { font-size: 0.7rem; color: var(--clr-text-muted); margin-top: 6px; }
.reaction-bar {
  display: flex;
  gap: 12px;
  margin: 32px 0 24px;
  flex-wrap: wrap;
}
.reaction-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1.5px solid var(--clr-border-glow);
  border-radius: 40px;
  padding: 6px 16px;
  font-weight: 500;
  font-size: 0.85rem;
  cursor: pointer;
  color: var(--clr-text-dim);
  transition: all 0.2s;
}
.reaction-btn:hover { border-color: var(--clr-cyan); transform: translateY(-2px); }
.reaction-btn.active { background: var(--gradient-cyan); border-color: transparent; color: #fff; }
.reaction-btn svg { margin-right: 2px; }
.comment-section { margin-top: 20px; width: 100%; overflow-x: hidden; }
.comment-input-group {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: nowrap;
  width: 100%;
}
.comment-input-group input {
  flex: 1;
  min-width: 0;
  padding: 10px 18px;
  border-radius: 50px;
  border: 1px solid var(--clr-border-glow);
  background: var(--clr-navy-card);
  color: var(--clr-white);
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
}
.comment-submit {
  background: var(--gradient-cyan);
  border: none;
  padding: 0 24px;
  border-radius: 50px;
  color: #fff;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.2s;
}
.comment-submit:hover { opacity: 0.9; }
.comments-list { max-height: 300px; overflow-y: auto; }
.comment-item {
  padding: 12px 0;
  border-bottom: 1px solid var(--clr-border-glow);
  font-size: 0.9rem;
  word-break: break-word;
}
.comment-item strong { color: var(--clr-cyan); }
.comment-item small { font-size: 0.7rem; color: var(--clr-text-muted); margin-left: 10px; }
.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: 2px solid var(--clr-cyan);
  color: var(--clr-cyan);
  padding: 12px 24px;
  border-radius: 50px;
  text-decoration: none;
  font-weight: 700;
  margin-top: 30px;
  transition: all 0.2s;
}
.back-link:hover { background: var(--clr-cyan); color: #fff; }
.back-link svg { margin-right: 2px; }
.loading-spinner {
  text-align: center;
  padding: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}
.spinner-svg {
  width: 60px;
  height: 60px;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@media (max-width: 768px) {
  .note-content { padding: 24px; }
  .main-nav { display: none; }
  .note-container { padding: 110px 16px 40px; }
  .comment-input-group { gap: 8px; }
  .comment-submit { padding: 0 16px; font-size: 0.85rem; }
  .reaction-btn { padding: 5px 12px; font-size: 0.8rem; }
  .resume-prompt { bottom: 20px; right: 20px; padding: 8px 16px; font-size: 0.75rem; }
  .progress-fixed-container { padding: 8px 16px 0 16px; }
  .progress-container { height: 10px; }
  .note-meta-bar { gap: 12px; }
  .breadcrumbs { font-size: 0.7rem; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="header-container">
    <a href="/" class="logo-link" id="logo-link">Aliver<span style="color:var(--clr-magenta);">Biopharm</span></a>
    <nav><ul class="main-nav" id="main-nav"></ul></nav>
  </div>
</header>

<div class="progress-fixed-container">
  <div class="progress-wrapper">
    <div class="progress-container">
      <div class="progress-bar-fill" id="progress-bar-fill"></div>
    </div>
    <div class="progress-percentage" id="progress-percentage">0% read</div>
  </div>
</div>

<main id="app-content"></main>
<footer class="footer-fat" id="footer"></footer>

<script>
const API_BASE = '/api/query';
let currentUser = null;
let currentLevel = null;
let maxScrollPercentage = 0;
let saveTimer = null;

const urlParams = new URLSearchParams(window.location.search);
const noteId = urlParams.get('id');
const level = urlParams.get('level') || 'O-Level';
const noteTitle = urlParams.get('title') || 'Study Note';
const returnTo = urlParams.get('return_to');
const returnSubtopic = urlParams.get('return_subtopic');
const returnTitle = urlParams.get('return_title');
currentLevel = level;

let backLinkUrl = '/';
if (returnTo && returnSubtopic) {
  if (returnTo === 'olevel') backLinkUrl = `/olevel.html?subtopic=${returnSubtopic}&title=${encodeURIComponent(returnTitle || '')}`;
  else if (returnTo === 'alevel') backLinkUrl = `/alevel.html?subtopic=${returnSubtopic}&title=${encodeURIComponent(returnTitle || '')}`;
  else if (returnTo === 'pharmacy') backLinkUrl = `/pharmacy.html?subtopic=${returnSubtopic}&title=${encodeURIComponent(returnTitle || '')}`;
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function redirectToHomepage() {
  window.location.href = '/';
}

function getScrollPercent() {
  const winScroll = window.scrollY || document.documentElement.scrollTop || 0;
  const height = document.documentElement.scrollHeight - window.innerHeight;
  if (height <= 0) return 0;
  let percent = (winScroll / height) * 100;
  return Math.min(100, Math.max(0, percent));
}

function updateProgressBar(percentage) {
  const fill = document.getElementById('progress-bar-fill');
  const text = document.getElementById('progress-percentage');
  if (fill) fill.style.width = percentage + '%';
  if (text) text.innerText = Math.floor(percentage) + '% read';
}

function saveProgressToLocal() {
  if (maxScrollPercentage >= 10) {
    localStorage.setItem('progress_' + noteId, maxScrollPercentage);
    localStorage.setItem('progress_' + noteId + '_time', Date.now());
  }
}

function loadProgressFromLocal() {
  const saved = localStorage.getItem('progress_' + noteId);
  if (saved) {
    let percentage = parseFloat(saved);
    percentage = Math.min(100, Math.max(0, percentage));
    if (percentage > 10 && percentage < 95) {
      maxScrollPercentage = percentage;
      updateProgressBar(maxScrollPercentage);
      showResumePrompt(percentage);
    } else if (percentage >= 95) {
      maxScrollPercentage = percentage;
      updateProgressBar(maxScrollPercentage);
    }
    return percentage;
  }
  return 0;
}

function handleScroll() {
  let currentPercent = getScrollPercent();
  currentPercent = Math.min(100, currentPercent);
  
  if (currentPercent > maxScrollPercentage) {
    maxScrollPercentage = currentPercent;
    updateProgressBar(maxScrollPercentage);
    
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function() {
      saveProgressToLocal();
    }, 1000);
  }
}

function showResumePrompt(savedPercentage) {
  if (!savedPercentage || savedPercentage <= 10 || savedPercentage >= 95) return;
  const existing = document.querySelector('.resume-prompt');
  if (existing) existing.remove();
  const prompt = document.createElement('div');
  prompt.className = 'resume-prompt';
  prompt.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg> Resume from ${Math.floor(savedPercentage)}%`;
  prompt.onclick = function() {
    const height = document.documentElement.scrollHeight - window.innerHeight;
    const targetPosition = (savedPercentage / 100) * height;
    window.scrollTo({ top: targetPosition, behavior: 'smooth' });
    prompt.remove();
  };
  document.body.appendChild(prompt);
  setTimeout(function() {
    if (prompt.parentNode) prompt.remove();
  }, 8000);
}

async function apiCall(action, params) {
  try {
    const res = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ action, ...params })
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error);
    return json.data !== undefined ? json.data : json;
  } catch(e) {
    console.error('API call failed:', e);
    return null;
  }
}

function showContent() {
  document.getElementById('app-content').innerHTML = `<div class="loading-spinner"><svg class="spinner-svg" viewBox="0 0 24 24" fill="none" stroke="var(--clr-cyan)" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg><p>Loading note...</p></div>`;
  loadNote();
}

function generateTableOfContents(contentHtml) {
  const headingMatches = contentHtml.match(/<h2[^>]*>.*?<\/h2>/gi);
  if (!headingMatches || headingMatches.length < 2) return '';
  let tocHtml = '<div class="table-of-contents"><h3><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--clr-magenta)" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg> Contents</h3><ul>';
  headingMatches.forEach(function(heading, idx) {
    const title = heading.replace(/<[^>]*>/g, '');
    const id = 'section-' + idx;
    tocHtml += '<li><a href="#' + id + '">' + esc(title) + '</a></li>';
  });
  tocHtml += '</ul></div>';
  return tocHtml;
}

function addHeadingIds(contentHtml) {
  let idx = 0;
  return contentHtml.replace(/<h2>/gi, function() { return '<h2 id="section-' + (idx++) + '">'; });
}

function extractKeyPoints(contentHtml) {
  const strongMatches = contentHtml.match(/<strong>([^<]+)<\/strong>/g);
  if (strongMatches && strongMatches.length >= 3) {
    let points = '';
    for (let i = 0; i < Math.min(6, strongMatches.length); i++) {
      const term = strongMatches[i].replace(/<[^>]*>/g, '');
      if (term.length > 3 && term.length < 60) points += '<li>' + esc(term) + '</li>';
    }
    if (points) return '<div class="key-points"><h3><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--clr-magenta)" stroke-width="2"><path d="M9.5 2.5L12 5l2.5-2.5a4.5 4.5 0 0 1 5.5 5.5L12 19 4 8a4.5 4.5 0 0 1 5.5-5.5z"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg> Key Terms to Remember</h3><ul>' + points + '</ul></div>';
  }
  return '';
}

function addShareButtons() {
  return `<div class="share-actions">
    <button class="share-action" id="copy-link-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--clr-magenta)" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy Link</button>
    <button class="share-action" id="share-note-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--clr-magenta)" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Share</button>
  </div>`;
}

async function loadRelatedNotes(currentNoteId, currentLevel, currentTopic) {
  try {
    const allNotes = await apiCall('get_notes_by_level', { level: currentLevel });
    if (!allNotes || !allNotes.length) return '';
    const related = allNotes.filter(function(n) { return n.id !== currentNoteId && n.topic === currentTopic; }).slice(0, 3);
    if (related.length === 0) return '';
    return '<div class="related-notes"><h3><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--clr-cyan)" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Related Notes</h3><div class="related-grid">' + related.map(function(n) {
      return '<a href="note.html?id=' + n.id + '&level=' + currentLevel + '&title=' + encodeURIComponent(n.title) + '" class="related-card"><strong>' + esc(n.title) + '</strong><p>' + esc(n.preview ? n.preview.substring(0, 80) : 'Click to read') + '...</p></a>';
    }).join('') + '</div></div>';
  } catch(e) {
    return '';
  }
}

function calculateReadTime(content) {
  const plainText = content.replace(/<[^>]*>/g, '');
  const words = plainText.trim().split(/\s+/).length;
  const minutes = Math.max(2, Math.ceil(words / 200));
  return `${minutes} min read`;
}

function updateFavicon(level) {
  let svgContent = '';
  if (level === 'Pharmacy') {
    svgContent = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#0f2b3d"/><defs><linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a5276"/><stop offset="100%" stop-color="#0a7e7e"/></linearGradient></defs><rect x="8" y="8" width="84" height="84" rx="18" fill="url(#pg)"/><rect x="35" y="25" width="30" height="50" rx="15" fill="#c0392b" opacity="0.9"/><rect x="35" y="25" width="15" height="50" rx="7" fill="#e74c3c" opacity="0.8"/><text x="50" y="58" font-size="24" text-anchor="middle" fill="#b8873a" font-weight="bold" font-family="Arial">Rx</text><circle cx="50" cy="50" r="40" fill="none" stroke="#b8873a" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/></svg>';
  } else if (level === 'A-Level') {
    svgContent = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#1a1a2e"/><defs><linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#16213e"/><stop offset="100%" stop-color="#0f3460"/></linearGradient></defs><rect x="8" y="8" width="84" height="84" rx="18" fill="url(#ag)"/><polygon points="50,20 75,45 50,70 25,45" fill="none" stroke="#e67e22" stroke-width="5" stroke-linejoin="round"/><polygon points="50,30 68,48 50,66 32,48" fill="none" stroke="#b8873a" stroke-width="3" stroke-linejoin="round"/><text x="50" y="56" font-size="20" text-anchor="middle" fill="#e67e22" font-weight="bold" font-family="Arial">Adv</text><circle cx="50" cy="50" r="38" fill="none" stroke="#b8873a" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/></svg>';
  } else if (level === 'O-Level') {
    svgContent = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#1b3b2b"/><defs><linearGradient id="og" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e5631"/><stop offset="100%" stop-color="#2d6a4f"/></linearGradient></defs><rect x="8" y="8" width="84" height="84" rx="18" fill="url(#og)"/><path d="M50 20 L70 35 L70 65 L50 80 L30 65 L30 35 Z" fill="none" stroke="#b8873a" stroke-width="4" stroke-linejoin="round"/><rect x="35" y="40" width="30" height="25" rx="3" fill="none" stroke="#a7c957" stroke-width="3"/><line x1="42" y1="48" x2="58" y2="48" stroke="#a7c957" stroke-width="2.5"/><line x1="42" y1="54" x2="58" y2="54" stroke="#a7c957" stroke-width="2.5"/><text x="50" y="72" font-size="12" text-anchor="middle" fill="#b8873a" font-weight="bold">O</text></svg>';
  } else {
    svgContent = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#0a2e2e"/><defs><linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0a7e7e"/><stop offset="100%" stop-color="#1a5276"/></linearGradient></defs><rect x="8" y="8" width="84" height="84" rx="18" fill="url(#dg)"/><text x="50" y="62" font-size="44" text-anchor="middle" fill="#b8873a" font-weight="bold" font-family="Arial">AB</text><circle cx="50" cy="50" r="35" fill="none" stroke="#b8873a" stroke-width="2" opacity="0.4"/></svg>';
  }
  const encodedSvg = encodeURIComponent(svgContent);
  const dataUrl = "data:image/svg+xml," + encodedSvg;
  let link = document.getElementById('dynamic-favicon');
  if (!link) {
    link = document.createElement('link');
    link.rel = 'icon';
    link.type = 'image/svg+xml';
    link.id = 'dynamic-favicon';
    document.head.appendChild(link);
  }
  link.href = dataUrl;
  let appleLink = document.querySelector("link[rel='apple-touch-icon']");
  if (!appleLink) {
    appleLink = document.createElement('link');
    appleLink.rel = 'apple-touch-icon';
    document.head.appendChild(appleLink);
  }
  appleLink.href = dataUrl;
}

async function loadNote() {
  const app = document.getElementById('app-content');
  try {
    const note = await apiCall('get_note_content', { subtopic_id: noteId, level: currentLevel });
    document.title = (note.title || noteTitle) + ' | AliverBiopharm ' + currentLevel + ' Notes';
    updateFavicon(currentLevel);
    
    const levelDisplay = { 'O-Level': 'O-LEVEL BIOLOGY', 'A-Level': 'A-LEVEL BIOLOGY', 'Pharmacy': 'PHARMACY' };
    const levelIcon = {
      'O-Level': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
      'A-Level': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><path d="M20 12L12 20M12 4L4 12M12 4v16M4 12h16"/><circle cx="12" cy="12" r="3"/></svg>',
      'Pharmacy': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="12" y1="6" x2="12" y2="14"/><line x1="8" y1="10" x2="16" y2="10"/></svg>'
    };
    
    const readTime = calculateReadTime(note.content || '');
    const lastUpdated = note.updated_at ? new Date(note.updated_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }) : new Date().toLocaleDateString();
    
    let processedContent = note.content || '<p>No content available for this note.</p>';
    const toc = generateTableOfContents(processedContent);
    const keyPoints = extractKeyPoints(processedContent);
    processedContent = addHeadingIds(processedContent);
    const shareButtons = addShareButtons();
    const relatedNotes = await loadRelatedNotes(noteId, currentLevel, note.topic || '');
    
    const levelPath = currentLevel === 'Pharmacy' ? 'pharmacy.html' : (currentLevel === 'A-Level' ? 'alevel.html' : 'olevel.html');
    
    maxScrollPercentage = 0;
    updateProgressBar(0);
    
    app.innerHTML = '<div class="note-container"><div class="note-header"><div class="level-badge">' + levelIcon[currentLevel] + ' ' + levelDisplay[currentLevel] + '</div><h1 class="note-title">' + esc(note.title || noteTitle) + '</h1><div class="note-meta-bar"><span class="note-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ' + readTime + '</span><span class="note-meta-item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Updated ' + lastUpdated + '</span></div><div class="breadcrumbs"><a href="/">Home</a><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg><a href="/' + levelPath + '">' + currentLevel + '</a><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg><span>' + esc(note.title || noteTitle) + '</span></div></div><div class="note-content">' + shareButtons + toc + processedContent + keyPoints + '<div class="reaction-bar" data-note-id="' + noteId + '"><button class="reaction-btn" data-reaction="like" onclick="toggleReaction(\'' + noteId + '\', \'like\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--clr-cyan)" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg> <span class="reaction-count like-count">0</span></button><button class="reaction-btn" data-reaction="love" onclick="toggleReaction(\'' + noteId + '\', \'love\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--clr-cyan)" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> <span class="reaction-count love-count">0</span></button><button class="reaction-btn" data-reaction="helpful" onclick="toggleReaction(\'' + noteId + '\', \'helpful\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--clr-cyan)" stroke-width="2"><path d="M9.5 2.5L12 5l2.5-2.5a4.5 4.5 0 0 1 5.5 5.5L12 19 4 8a4.5 4.5 0 0 1 5.5-5.5z"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg> <span class="reaction-count helpful-count">0</span></button></div><div class="comment-section"><div class="comment-input-group"><input type="text" id="comment-input" placeholder="Add a comment or question..."><button class="comment-submit" onclick="submitComment()">Post</button></div><div class="comments-list" id="comments-list"></div></div>' + relatedNotes + '<div style="margin-top:30px;"><a href="' + backLinkUrl + '" class="back-link" onclick="sessionStorage.setItem(\'fromNote\', \'true\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--clr-cyan)" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back to ' + currentLevel + ' Notes</a></div></div></div>';
    
    document.getElementById('copy-link-btn')?.addEventListener('click', function() {
      navigator.clipboard.writeText(window.location.href);
      alert('Link copied to clipboard!');
    });
    document.getElementById('share-note-btn')?.addEventListener('click', function() {
      if (navigator.share) {
        navigator.share({ title: document.title, url: window.location.href });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link copied to clipboard!');
      }
    });
    
    await loadReactions();
    await loadComments();
    loadProgressFromLocal();
    
    window.removeEventListener('scroll', handleScroll);
    window.addEventListener('scroll', handleScroll);
    window.addEventListener('beforeunload', function() { saveProgressToLocal(); });
  } catch (err) {
    console.error(err);
    document.getElementById('app-content').innerHTML = '<div class="note-container"><div style="text-align:center; padding:80px;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--clr-magenta)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="var(--clr-magenta)" stroke="none"/></svg><p style="margin-top:16px;">Failed to load note. Please try again.</p><a href="' + (backLinkUrl !== '/' ? backLinkUrl : '/') + '" class="back-link" style="margin-top:10px; display:inline-block;">Back</a></div></div>';
  }
}

async function loadReactions() {
  try {
    const data = await apiCall('get_note_reactions', { note_id: noteId });
    if (data) {
      const likeSpan = document.querySelector('.like-count');
      const loveSpan = document.querySelector('.love-count');
      const helpfulSpan = document.querySelector('.helpful-count');
      if (likeSpan) likeSpan.textContent = data.counts?.like || 0;
      if (loveSpan) loveSpan.textContent = data.counts?.love || 0;
      if (helpfulSpan) helpfulSpan.textContent = data.counts?.helpful || 0;
      if (data.user_reaction) {
        const activeBtn = document.querySelector('.reaction-btn[data-reaction="' + data.user_reaction + '"]');
        if (activeBtn) activeBtn.classList.add('active');
      }
    }
  } catch (err) { console.error(err); }
}

window.toggleReaction = async function(noteId, reactionType) {
  if (!currentUser) { redirectToHomepage(); return; }
  try {
    await apiCall('toggle_note_reaction', { note_id: noteId, reaction_type: reactionType });
    await loadReactions();
  } catch (err) { console.error(err); }
};

async function loadComments() {
  try {
    const interactions = await apiCall('get_resource_interactions', { resource_id: noteId });
    const commentList = document.getElementById('comments-list');
    if (commentList && interactions?.comments) {
      if (interactions.comments.length === 0) {
        commentList.innerHTML = '<div style="text-align:center; padding:20px; color:var(--clr-text-muted);">No comments yet. Be the first to ask a question!</div>';
      } else {
        commentList.innerHTML = interactions.comments.map(function(c) {
          return '<div class="comment-item"><strong>' + esc(c.user_name || 'User') + '</strong> <small>' + new Date(c.created_at).toLocaleDateString() + '</small><br>' + esc(c.comment) + '</div>';
        }).join('');
      }
    }
  } catch (err) { console.error(err); }
}

window.submitComment = async function() {
  if (!currentUser) { redirectToHomepage(); return; }
  const input = document.getElementById('comment-input');
  const comment = input?.value.trim();
  if (!comment) return;
  try {
    await apiCall('comment_resource', { resource_id: noteId, comment: comment });
    if (input) input.value = '';
    await loadComments();
  } catch (err) { console.error(err); }
};

async function loadNavigationAndFooter() {
  try {
    const sections = await apiCall('get_all_site_sections');
    if (sections) {
      if (sections.site_config?.logo_url) {
        document.querySelectorAll('.logo-link').forEach(function(link) {
          link.innerHTML = '<img src="' + esc(sections.site_config.logo_url) + '" alt="AliverBiopharm" style="height:45px;width:auto;max-height:50px;">';
        });
      }
      if (sections.navigation?.links) {
        const mainNav = document.getElementById('main-nav');
        if (mainNav) {
          mainNav.innerHTML = sections.navigation.links.map(function(link) { return '<li><a href="' + esc(link.href) + '">' + esc(link.label) + '</a></li>'; }).join('');
        }
      }
      if (sections.footer) {
        const footer = document.getElementById('footer');
        if (footer) {
          footer.innerHTML = '<div style="max-width:1200px; margin:0 auto; padding:40px 24px 24px; border-top:1px solid var(--clr-border-glow);"><div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px; font-size:0.75rem; color:var(--clr-text-muted);"><p>&copy; ' + new Date().getFullYear() + ' AliverBiopharm. All rights reserved.</p><div style="display:flex;gap:24px;"><a href="/privacy" style="color:var(--clr-text-dim); text-decoration:none;">Privacy Policy</a><a href="/terms" style="color:var(--clr-text-dim); text-decoration:none;">Terms of Use</a></div></div></div>';
        }
      }
    }
  } catch (err) { console.error(err); }
}

document.addEventListener('DOMContentLoaded', async function() {
  await loadNavigationAndFooter();
  try {
    const userData = await apiCall('get_user');
    if (userData?.user) {
      currentUser = userData.user;
      showContent();
    } else {
      redirectToHomepage();
    }
  } catch(e) {
    redirectToHomepage();
  }
});
</script>
